<!DOCTYPE html><html lang="zh-CN"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>涅瓦河：未竟之书</title>
<style>
:root{
  --bg:#151817;--paper:#dfd0ae;--muted:#a99f88;--gold:#c5a56b;
  --line:#756447;--red:#be8073;--green:#91aa94;--panel:#20241f;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--paper);
  font-family:"Noto Serif SC","Songti SC",SimSun,serif;
  line-height:1.7;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:20;
  opacity:.12;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.5' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
}
button{font:inherit}
button{
  cursor:pointer;color:var(--paper);background:#282b24;
  border:1px solid #625940;border-radius:3px;transition:.18s;
}
button:hover:not(:disabled){
  background:#36392e;border-color:var(--gold);transform:translateY(-1px);
}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
button:disabled{cursor:not-allowed;opacity:.4}
small,.muted{color:var(--muted)}
header{
  max-width:1440px;margin:auto;padding:26px 28px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.eyebrow{letter-spacing:.25em;font-size:11px;color:var(--gold)}
h1{font-size:30px;font-weight:500;letter-spacing:.12em;margin:4px 0}
.subtitle{color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{padding:7px 12px;font-size:12px}
.stats{
  max-width:1384px;margin:0 auto 18px;display:grid;
  grid-template-columns:1.5fr repeat(4,1fr);border:1px solid var(--line);
  background:#1d211d;
}
.stat{padding:12px 16px;border-right:1px solid #494531}
.stat:last-child{border:0}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat strong{font-weight:400;font-size:20px}
main{
  max-width:1440px;margin:auto;padding:0 28px 28px;
  display:grid;grid-template-columns:260px minmax(330px,1fr) 290px;
  gap:18px;align-items:start;
}
.panel{background:var(--panel);border:1px solid #544f3b}
.panel-title{
  padding:12px 15px;border-bottom:1px solid #544f3b;
  display:flex;align-items:center;justify-content:space-between;font-size:14px;
}
.panel-title small{font-size:10px;letter-spacing:.1em}
.city{height:215px;overflow:hidden;border-bottom:1px solid #544f3b;background:#242c2a}
.city svg{width:100%;height:100%}
.locations{padding:10px;display:grid;gap:7px}
.place{text-align:left;padding:9px 11px;position:relative}
.place.active{border-color:var(--gold);background:#3c3b2d}
.place b{display:block;font-size:14px;font-weight:400}
.place small{display:block;font-size:11px}
.place .number{float:right;color:#ad9261}
.travel-note{font-size:11px;padding:0 14px 13px;color:var(--muted)}
.scene-head{padding:15px 20px;border-bottom:1px solid #544f3b}
.scene-head h2{font-size:21px;font-weight:400;margin:3px 0}
.scene-head small{font-size:11px}
.stage{
  height:280px;position:relative;overflow:hidden;
  background:linear-gradient(#293638,#56605b 65%,#292c29);
}
.stage svg.backdrop{position:absolute;inset:0;width:100%;height:100%}
.stage:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#131a1780,transparent 45%,#131a1770),
             linear-gradient(0deg,#151a19,transparent 40%);
}
.portrait{position:absolute;right:8%;bottom:-10px;height:280px;width:196px}
.portrait svg{width:100%;height:100%;filter:drop-shadow(-12px 5px 12px #0007)}
.stage-caption{position:absolute;left:22px;bottom:20px;z-index:2;max-width:48%}
.stage-caption strong{font-size:21px;font-weight:400;display:block;text-shadow:0 2px 5px #000}
.stage-caption span{font-size:12px;color:#c7bfa9}
.snow{position:absolute;inset:-100% 0 0;pointer-events:none;z-index:3;opacity:.35;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 80px 80px,#fff 99%,transparent);
  background-size:110px 110px,173px 173px;animation:snow 17s linear infinite;
}
@keyframes snow{to{transform:translateY(110px)}}
.story{padding:20px 24px 12px;min-height:165px}
.story h3{margin:0 0 10px;font-weight:400;font-size:18px;color:#eadbb5}
.story p{margin:0;font-size:15px;line-height:1.95}
.choices{padding:0 20px 20px;display:grid;gap:9px}
.choice{padding:11px 14px;text-align:left;display:flex;gap:12px;align-items:start}
.choice .key{
  border:1px solid #6c6248;min-width:23px;height:23px;
  font-size:12px;text-align:center;margin-top:2px;color:var(--gold);
}
.choice b{font-size:14px;font-weight:400;display:block}
.choice small{font-size:11px;display:block;margin-top:3px}
.outcome{
  margin:0 20px 16px;padding:12px 14px;border-left:2px solid var(--gold);
  background:#c5a56b0b;font-size:13px;
}
.outcome:empty{display:none}
.cast-list{padding:10px}
.person{
  width:100%;display:grid;grid-template-columns:44px 1fr;
  gap:10px;text-align:left;padding:9px;margin-bottom:7px;
}
.avatar{height:55px;overflow:hidden;background:#404339;border:1px solid #706248}
.avatar svg{width:54px;height:78px;margin-left:-5px}
.person-name{font-size:12px;display:flex;justify-content:space-between;gap:4px}
.person-name em{font-size:10px;color:var(--muted);font-style:normal}
.bar{height:3px;background:#111915;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.person small{font-size:10px}
.rest{margin:0 10px 12px;width:calc(100% - 20px);padding:10px;font-size:12px}
.journal{margin-top:16px}
.entries{padding:12px 15px;max-height:290px;overflow:auto}
.entry{font-size:12px;margin-bottom:12px;border-bottom:1px dashed #544f3b;padding-bottom:10px}
.entry small{display:block;color:var(--gold);font-size:10px}
footer{text-align:center;padding:0 20px 25px;font-size:11px;color:#948b75}
dialog{
  width:min(760px,calc(100% - 28px));max-height:88vh;overflow:auto;
  background:#e0d2b1;color:#302c24;border:1px solid #b69861;
  padding:30px;box-shadow:0 25px 100px #000a;
}
dialog::backdrop{background:#080e0cd9}
dialog h2{font-size:27px;font-weight:400;margin:0 0 15px}
dialog p{font-size:14px}
dialog button{padding:9px 18px;margin:8px 8px 0 0;background:#343a30;color:#e4d5b1}
dialog .muted{color:#73684e}
.ending-card{border-top:1px solid #9b8b6a;padding:15px 0;display:flex;gap:16px}
.ending-card .end-face{width:65px;min-width:65px;height:88px;overflow:hidden;background:#b3ad96}
.end-face svg{width:75px;height:107px;margin-left:-5px}
.ending-card h3{font-size:16px;margin:0 0 6px}
.ending-card p{font-size:13px;margin:0}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#dfd0ae;color:#272e25;border:1px solid #a58e61;
  padding:10px 18px;z-index:40;font-size:13px;box-shadow:0 5px 25px #0005;
  max-width:90vw;
}
@media(max-width:1100px){
  main{grid-template-columns:220px 1fr}
  .right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .journal{margin-top:0}
  .cast-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .person{margin:0}
  .stats{margin:0 28px 18px}
}
@media(max-width:650px){
  header{padding:18px 15px;align-items:start}
  h1{font-size:23px}.subtitle{font-size:10px}.tools{max-width:105px}
  .tools button{padding:5px 8px}
  .stats{margin:0 14px 14px;grid-template-columns:repeat(4,1fr)}
  .stat:first-child{grid-column:1/-1;border-bottom:1px solid #494531}
  .stat:first-child span,.stat:first-child strong{display:inline;margin-right:12px}
  .stat{padding:8px 10px}.stat strong{font-size:17px}
  main{padding:0 14px 18px;display:flex;flex-direction:column;gap:14px}
  main>.panel,main>.right{width:100%}
  .city{height:100px}
  .locations{grid-template-columns:repeat(3,1fr);gap:5px}
  .place{padding:7px}.place b{font-size:11px}.place small{font-size:9px}
  .travel-note{padding-bottom:8px}
  .right{display:flex;flex-direction:column;gap:14px}
  .stage{height:240px}.portrait{height:250px;right:3%}
  .stage-caption{left:16px}.stage-caption strong{font-size:18px}
  .story{padding:17px}.story p{font-size:14px}
  .choices{padding:0 14px 16px}.choice{padding:10px}
  dialog{padding:22px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">НЕВА · A BOOK OF UNFINISHED LIVES</div>
    <h1>涅瓦河：未竟之书</h1>
    <div class="subtitle">六日之内，听见六个人尚未说完的话。</div>
  </div>
  <div class="tools">
    <button id="helpBtn">玩法</button>
    <button id="endingBtn" hidden="">阅读终章</button>
    <button id="restartBtn">重新开始</button>
  </div>
</header>

<section class="stats" aria-label="当前状态">
  <div class="stat"><span id="weather">薄雪 · 清晨</span><strong id="clock"></strong></div>
  <div class="stat"><span>口袋 / 卢布</span><strong id="money"></strong></div>
  <div class="stat"><span>良知</span><strong id="conscience"></strong></div>
  <div class="stat"><span>心力</span><strong id="spirit"></strong></div>
  <div class="stat"><span>警方疑心</span><strong id="suspicion"></strong></div>
</section>

<main>
  <section class="panel">
    <div class="panel-title">彼得堡手绘地图 <small>六处灯火</small></div>
    <div class="city" id="city"></div>
    <nav class="locations" id="locations" aria-label="地点"></nav>
    <div class="travel-note">切换地点不消耗行动。每次选择消耗一格时间。</div>
  </section>

  <section class="panel" id="scenePanel">
    <div class="scene-head">
      <small id="sceneTag"></small>
      <h2 id="placeTitle"></h2>
    </div>
    <div class="stage">
      <svg class="backdrop" viewBox="0 0 680 280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#243338"></stop><stop offset="1" stop-color="#77786a"></stop>
          </linearGradient>
        </defs>
        <path fill="url(#sky)" d="M0 0h680v280H0z"></path>
        <circle cx="490" cy="49" r="25" fill="#d4ceb0" opacity=".3"></circle>
        <g fill="#35403e" stroke="#899084" stroke-width=".7">
          <path d="M0 75h110v145H0zM118 100h99v123h-99zM230 64h144v160H230zM386 91h126v143H386zM525 54h155v183H525z"></path>
          <path d="M-5 75l57-23 61 23M224 64l80-22 74 22M520 54l78-23 88 23"></path>
        </g>
        <g fill="#c6a36a" opacity=".53">
          <path d="M20 101h13v24H20zM61 102h13v24H61zM21 149h13v23H21zM155 125h13v21h-13zM270 90h14v24h-14zM313 91h14v24h-14zM313 143h14v24h-14zM424 119h13v23h-13zM465 164h13v23h-13zM556 81h13v22h-13zM603 125h13v24h-13z"></path>
        </g>
        <path d="M0 225Q280 201 680 244V280H0" fill="#94988b"></path>
        <path d="M0 238Q320 215 680 254" stroke="#c5c5af" fill="none" opacity=".4"></path>
        <g stroke="#222b28" stroke-width="5" fill="none">
          <path d="M98 250V98M83 117h30M91 97v-16h15v16"></path>
          <path d="M470 252v-94"></path>
        </g>
        <path d="M87 84h23l-4 28H91z" fill="#c8aa6a" opacity=".6"></path>
        <path d="M0 266l680-9" stroke="#293430" stroke-width="13"></path>
      </svg>
      <div class="portrait" id="portrait"></div>
      <div class="stage-caption"><strong id="charName"></strong><span id="charSubtitle"></span></div>
      <div class="snow"></div>
    </div>
    <div class="story" id="story"></div>
    <div class="outcome" id="outcome" role="status" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </section>

  <aside class="right">
    <section class="panel">
      <div class="panel-title">尚未合上的命运 <small>点击人物前往</small></div>
      <div class="cast-list" id="cast"></div>
      <button class="rest" id="restBtn">抄写一页书稿 · 心力 +2 / 卢布 +1 / 时间 −1</button>
    </section>
    <section class="panel journal">
      <div class="panel-title">无名抄写员的手记 <small>自动存档</small></div>
      <div class="entries" id="journal" aria-live="polite"></div>
    </section>
  </aside>
</main>

<footer>跨作品架空叙事 · 对话均为本游戏创作，非原著引文 · 选择快捷键 1 / 2 / 3</footer>
<dialog id="modal"></dialog>
<div class="toast" id="toast" hidden="" role="status"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const SAVE = "neva-unfinished-v1";

const names = ["rodion", "sonya", "myshkin", "nastasya", "ivan", "alyosha"];

const people = {
  rodion: {
    name: "拉斯柯尔尼科夫",
    short: "罗季昂",
    place: "干草广场阁楼",
    role: "把自己交给一个可怕思想的青年",
    source: "《罪与罚》",
    color: "#514e42",
    hair: "#352d27",
    skin: "#c7b69b",
    type: "student",
    endings: [
      "他离开了阁楼，仍把人群看成一道需要证明的题。你的手记停在那扇再未打开的门前。",
      "他走到警署的台阶下，却没有进去。索尼娅坐在不远处。至少这一回，他没有独自离开。",
      "他终于决定说出真相，不再借一种理论逃避具体的人。前路漫长，责任却第一次有了名字。"
    ]
  },
  sonya: {
    name: "索尼娅",
    short: "索尼娅",
    place: "运河边出租屋",
    role: "也需要被照顾的照顾者",
    source: "《罪与罚》",
    color: "#675b45",
    hair: "#574434",
    skin: "#d8bfa2",
    type: "scarf",
    endings: [
      "她把最后一块面包留给别人，又一次缩回寒冷的房间。城里有人赞美她的善良，却无人替她生火。",
      "屋里的灯终于没有熄灭。她仍艰难地生活，但有了可以敲门求助的邻人。",
      "她找到一份抄写与缝补的活计，也学会为自己留下一份食物。她不再只作为别人的救赎存在。"
    ]
  },
  myshkin: {
    name: "梅什金公爵",
    short: "梅什金",
    place: "积雪的花园",
    role: "不愿把怜悯误认作爱情的人",
    source: "《白痴》",
    color: "#63716a",
    hair: "#a68b60",
    skin: "#d5c5a9",
    type: "prince",
    endings: [
      "他试图替每个人承担痛苦，最终连自己的声音也听不清了。花园里的长椅空了下来。",
      "他离开了喧闹的客厅，承认善意不能自动成为答案。有人愿意与他继续通信。",
      "他学会先问对方愿不愿意，再伸出手。他仍然温柔，却不再把自己许诺成万能的庇护。"
    ]
  },
  nastasya: {
    name: "娜斯塔霞",
    short: "娜斯塔霞",
    place: "烛光中的客厅",
    role: "拒绝被估价、被裁决、被拯救",
    source: "《白痴》",
    color: "#493a3b",
    hair: "#292523",
    skin: "#dac0ac",
    type: "lady",
    endings: [
      "她在旁人的争夺与流言中失去了退路。你没有得知她的去向，只见报纸把她写成一个故事。",
      "她推迟了那场决定命运的聚会。桌上仍有未拆的信，但她开始自己选择回信的顺序。",
      "她以自己的名字租下房间，带着亲手选定的行李离去。这一次，离开不是任何人的奖赏。"
    ]
  },
  ivan: {
    name: "伊万",
    short: "伊万",
    place: "烟雾缭绕的酒馆",
    role: "追问世界、也被自己的问题追问",
    source: "《卡拉马佐夫兄弟》",
    color: "#3c4548",
    hair: "#352f29",
    skin: "#c6b299",
    type: "thinker",
    endings: [
      "他的辩论越来越像独白。酒馆关门后，空椅子仍像坐着一个只有他能看见的听众。",
      "他没有找到能让世界无罪的答案，却允许弟弟坐在身边，直到天亮。",
      "他把锋利的论证放下片刻，决定承担自己能够承担的责任。疑问尚在，他不再只与影子争辩。"
    ]
  },
  alyosha: {
    name: "阿辽沙",
    short: "阿辽沙",
    place: "修院外的石阶",
    role: "把信仰带回泥泞街道的青年",
    source: "《卡拉马佐夫兄弟》",
    color: "#4b5144",
    hair: "#715537",
    skin: "#d9c0a1",
    type: "monk",
    endings: [
      "他还在安慰别人，却逐渐不敢承认自己的疲惫。那些没有兑现的约定在口袋里积成一叠纸。",
      "孩子们记住了一个守约的大人。他的信念有时摇晃，却不再只停留于言辞。",
      "他组织起一张互相照应的小小名单，也把自己的名字写了进去。善意成为可以轮流承担的日常。"
    ]
  }
};

function fresh() {
  return {
    version: 1,
    day: 1,
    ap: 3,
    m: 9,
    c: 5,
    e: 7,
    s: 0,
    loc: "rodion",
    done: false,
    progress: Object.fromEntries(names.map(id => [id, 0])),
    fate: Object.fromEntries(names.map(id => [id, 0])),
    visited: Object.fromEntries(names.map(id => [id, 0])),
    last: "",
    logs: [
      {
        day: 1,
        text: "我是一名无名抄写员。六天后，邮车将带我离开这座城。留下的时间，够听见多少个人？"
      }
    ]
  };
}

let state = fresh();
let loaded = false;
let toastTimer;

function portrait(id) {
  const p = people[id];
  const female = ["scarf", "lady"].includes(p.type);
  const coat = p.color;
  const hair = p.hair;
  const skin = p.skin;

  let clothing = "";
  let head = "";

  if (p.type === "student") {
    clothing = `
      <path d="M35 280l8-105 38-23 20 23 22-23 36 24 11 104" fill="${coat}"/>
      <path d="M81 152l-10 44 26-17-12 69M123 153l11 42-25-16 12 101" stroke="#86775d" fill="none" stroke-width="3"/>
      <path d="M88 157l15 21 13-20-3 64-18-2z" fill="#a29879"/>
      <path d="M50 223l18-5 3 27-23 2" fill="#655e4d" stroke="#99896a"/>`;

      [
        option("帮他排轮值表，也写上谁来照顾他", "心力 −2 · 阿辽沙与索尼娅均改善", { e: -2 }, { alyosha: 3, sonya: 1 }, "纸上终于出现了轮休。有人笑着说，圣人也得睡觉。这次他没有反驳。"),
        option("替他完成今天的探访，让他去看伊万", "心力 −2 · 两兄弟的命运均改善", { e: -2 }, { alyosha: 2, ivan: 2 }, "他把名单交给你，快步穿过广场。那不是逃开责任，而是认出了另一种责任。"),
        option("劝他只顾高尚的事业，不必理会家人", "良知 −1 · 两兄弟之间的距离加深", { c: -1 }, { alyosha: -2, ivan: -2 }, "他将信折好，放回口袋。石阶上那一小块没有融化的雪，被踩成了冰。")
      ]
    )
  ]
};

try {
  const saved = JSON.parse(localStorage.getItem(SAVE));
  if (
    saved &&
    saved.version === 1 &&
    names.includes(saved.loc) &&
    ["day", "ap", "m", "c", "e", "s"].every(k => Number.isFinite(saved[k])) &&
    ["progress", "fate", "visited"].every(k => saved[k] && names.every(id => Number.isFinite(saved[k][id]))) &&
    Array.isArray(saved.logs)
  ) {
    state = saved;
    loaded = true;
  }
} catch (err) {
  loaded = false;
}

const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function save() {
  try {
    localStorage.setItem(SAVE, JSON.stringify(state));
  } catch (err) {
    $("journal").title = "浏览器未允许存档；当前页面内仍可继续游玩。";
  }
}

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $("toast").hidden = true;
  }, 3200);
}

function log(text) {
  state.logs.unshift({ day: state.day, text });
}

function fateLabel(v) {
  if (v >= 5) return "有了新的道路";
  if (v >= 2) return "正在靠近灯火";
  if (v >= 0) return "站在岔路口";
  if (v >= -3) return "向孤独退去";
  return "灯火将熄";
}

function currentScene() {
  const id = state.loc;
  const index = state.progress[id];

  if (index < 2) return scenes[id][index];

  return scene(
    "故事之外的一小时",
    `${people[id].short}已经与你谈过那些难以启齿的事。并没有奇迹发生，窗外依旧寒冷。你现在能做的，是让某个普通的小时不再那么难以度过。`,
    [
      option("留下，认真听一会儿", "心力 −2 · 此人的命运 +1", { e: -2 }, { [id]: 1 }, "你没有提出新的答案。离开时，房间里的沉默却不再与先前一样。"),
      option("留下一份饭钱", "卢布 −2 · 此人的命运 +1", { m: -2 }, { [id]: 1 }, "两枚钱币解决不了命运，却可以让今晚不必空腹。"),
      option("一起散步，不逼迫对方开口", "心力 +1 · 疑心 −1 · 命运不变", { e: 1, s: -1 }, {}, "你们走过一段结冰的街道。不是每一次相逢都必须改变什么。")
    ]
  );
}

function available(o) {
  return !state.done &&
    (!o.effects.m || state.m + o.effects.m >= 0) &&
    (!o.effects.e || state.e + o.effects.e >= 0);
}

function shortage(o) {
  if (o.effects.m && state.m + o.effects.m < 0) return "卢布不足";
  if (o.effects.e && state.e + o.effects.e < 0) return "心力不足，可先抄写书稿";
  return "";
}

function apply(o) {
  for (const [key, value] of Object.entries(o.effects)) {
    const max = key === "m" ? 99 : 10;
    state[key] = clamp(state[key] + value, 0, max);
  }

  for (const [id, value] of Object.entries(o.f)) {
    state.fate[id] = clamp(state.fate[id] + value, -8, 10);
  }
}

function choose(index) {
  if (state.done || $("modal").open) return;

  const id = state.loc;
  const o = currentScene().options[index];

  if (!o || !available(o)) return;

  apply(o);
  state.progress[id] = Math.min(2, state.progress[id] + 1);
  state.visited[id]++;
  state.last = o.result;
  log(`${people[id].short}：${o.result}`);
  spendTime();
}

function dawn() {
  state.e = clamp(state.e + 2, 0, 10);

  const events = {
    2: [
      ["sonya", "房东开始催租。索尼娅把自己的晚饭藏到了孩子们看不见的地方。"],
      ["rodion", "阁楼里一整夜亮着灯。罗季昂越来越少走下楼梯。"]
    ],
    3: [
      ["myshkin", "公爵收到更多求助信，却还没有人问他是否睡过觉。"],
      ["nastasya", "客厅的流言传到街上。娜斯塔霞收到了一封不愿拆开的信。"]
    ],
    4: [
      ["ivan", "酒馆的人说，伊万又独自待到了打烊。"],
      ["alyosha", "阿辽沙错过了与孩子们的约定；他承担的事已经太多。"]
    ]
  };

  for (const [id, text] of events[state.day] || []) {
    if (state.visited[id] === 0) {
      state.fate[id] = clamp(state.fate[id] - 1, -8, 10);
      log("城中消息：" + text + "〔尚未探访：命运 −1〕");
    } else {
      log(`城中消息：${people[id].short}遇见了新的难处，但此前的相逢让这一天稍有不同。`);
    }
  }

  if (state.s >= 6) {
    state.e = clamp(state.e - 2, 0, 10);
    state.s = clamp(state.s - 2, 0, 10);
    log("警方拦下你盘问。没有人被带走，但你耗费了心力。〔心力 −2，疑心 −2〕");
  }

  if (state.day === 5) {
    const links = [["sonya", "rodion"], ["nastasya", "myshkin"], ["alyosha", "ivan"]];
    for (const [from, to] of links) {
      if (state.fate[from] >= 4) {
        state.fate[to] = clamp(state.fate[to] + 1, -8, 10);
        log(`${people[from].short}主动去见了${people[to].short}。你的选择之外，他们也在选择彼此。〔${people[to].short}命运 +1〕`);
      }
    }
  }

  if (state.day === 6) {
    log("邮车明日清晨出发。这是留在彼得堡的最后一天。");
  }
}

function spendTime() {
  state.ap--;

  if (state.ap <= 0) {
    if (state.day === 6) {
      state.done = true;
      log("最后一夜过去了。我合上手记，远处传来邮车的铃声。");
    } else {
      state.day++;
      state.ap = 3;
      dawn();
      state.last += "\n\n天亮了。休息恢复心力 2 点；城中消息已写入手记。";
    }
  }

  save();
  render();

  if (state.done) showEnding();
}

function visit(id) {
  state.loc = id;
  state.last = "";
  save();
  render();
}

function rest() {
  if (state.done) return;

  state.e = clamp(state.e + 2, 0, 10);
  state.m = Math.min(99, state.m + 1);
  state.last = "你在油灯下抄写了一页书稿。句子属于别人，换来的一个卢布属于今晚。";
  log("抄写书稿，稍作休整。〔心力 +2，卢布 +1〕");
  spendTime();
}

function render() {
  const p = people[state.loc];
  const sc = currentScene();

  $("clock").textContent = state.done ? "第六日 · 全书终" : `第 ${state.day} 日 · 余 ${state.ap} 次行动`;

  const weather = ["薄雪", "浓雾", "冷雨", "霜冻", "北风", "雪停"];
  $("weather").textContent = state.done ? "邮车的清晨" : `${weather[state.day - 1]} · ${["夜晚", "黄昏", "午后", "清晨"][state.ap]}`;

  $("money").textContent = state.m;
  $("conscience").textContent = state.c + " / 10";
  $("spirit").textContent = state.e + " / 10";
  $("suspicion").textContent = state.s + " / 10";
  $("suspicion").style.color = state.s >= 6 ? "var(--red)" : "";

  $("city").innerHTML = cityMap();

  $("locations").innerHTML = names.map((id, i) => `
    <button class="place ${state.loc === id ? "active" : ""}" data-place="${id}" aria-pressed="${state.loc === id}">
      <span class="number">${i + 1}</span>
      <b>${people[id].place}</b>
      <small>${people[id].short} · ${state.progress[id]}/2 段关键故事</small>
    </button>
  `).join("");

  $("placeTitle").textContent = p.place;
  $("sceneTag").textContent = `${p.source} · ${state.progress[state.loc] < 2 ? "关键故事 " + (state.progress[state.loc] + 1) + " / 2" : "日常相伴"}`;
  $("portrait").innerHTML = portrait(state.loc);
  $("charName").textContent = p.name;
  $("charSubtitle").textContent = p.role;

  $("story").innerHTML = state.done
    ? "<h3>人们继续生活，书页暂且合上</h3><p>你的十八次行动已经结束。你可以查看人物状态与手记，或重新阅读终章。</p>"
    : `<h3>${escapeHTML(sc.title)}</h3><p>${escapeHTML(sc.text)}</p>`;

  $("outcome").textContent = state.last;
  $("outcome").style.whiteSpace = "pre-line";

  $("choices").innerHTML = state.done ? "" : sc.options.map((o, i) => `
    <button class="choice" data-choice="${i}" ${available(o) ? "" : "disabled"}>
      <span class="key">${i + 1}</span>
      <span>
        <b>${escapeHTML(o.text)}</b>
        <small>${escapeHTML(o.hint)}${available(o) ? "" : " · " + shortage(o)}</small>
      </span>
    </button>
  `).join("");

  $("cast").innerHTML = names.map(id => `
    <button class="person" data-place="${id}">
      <div class="avatar">${portrait(id)}</div>
      <div>
        <div class="person-name">${people[id].short}<em>${state.progress[id]}/2</em></div>
        <div class="bar">
          <i style="width:${((state.fate[id] + 8) / 18) * 100}%;background:${state.fate[id] < 0 ? "var(--red)" : "var(--gold)"}"></i>
        </div>
        <small>${fateLabel(state.fate[id])} · ${state.fate[id] > 0 ? "+" : ""}${state.fate[id]}</small>
      </div>
    </button>
  `).join("");

  $("journal").innerHTML = state.logs.map(l => `
    <div class="entry">
      <small>第 ${l.day} 日</small>
      ${escapeHTML(l.text)}
    </div>
  `).join("");

  $("restBtn").disabled = state.done;
  $("endingBtn").hidden = !state.done;
}

function openModal(html) {
  const d = $("modal");
  if (d.open) d.close();
  d.innerHTML = html;
  d.showModal();
}

function help() {
  openModal(`
    <div class="eyebrow" style="color:#75613d">一名无名抄写员的六日</div>
    <h2>你不是救世主，只是恰好经过。</h2>
    <p>你将在六天后离开彼得堡。每天有三次行动；在地图上切换地点不耗时，作出选择或抄写书稿耗时一次。</p>
    <p><b>卢布</b>支付食物、车费与押金。<b>心力</b>用于倾听、陪伴与奔走；每天清晨恢复 2 点。抄写书稿可获得 1 卢布、恢复 2 点心力。</p>
    <p><b>良知</b>影响你自己的终章；<b>疑心</b>达到 6 时，次日清晨会遭盘问，额外损失 2 点心力，疑心降低 2 点。</p>
    <p>每人有两段关键故事，之后仍可日常相伴。人物命运会彼此影响。第二至第四天，部分尚未探访的人物会因生活压力失去 1 点命运；第五天，足够稳定的关系可能带来主动互助。</p>
    <p>终章会分别记录六个人的去向。命运达到 5 且完成两段关键故事，才能打开该人物的新道路；低于 0 则更趋孤独。并不存在还原原著的唯一正确选择。</p>
    <p class="muted">人物来自不同作品，本游戏让他们在同一座架空的城市相遇。所有对话为原创改写。进度自动保存在当前浏览器；隐私模式或浏览器设置可能限制存档。</p>
    <button data-modal="close">${loaded ? "回到这座城" : "翻开第一页"}</button>
  `);
}

function showEnding() {
  const good = names.filter(id => state.fate[id] >= 5 && state.progress[id] >= 2).length;
  const dark = names.filter(id => state.fate[id] < 0).length;

  let title;
  let text;

  if (state.c <= 2) {
    title = "墨迹下的污点";
    text = "你比来时更懂得利用人心，也更难为自己的句子署名。有人因你得到帮助，有人被你换成了钱；这些事不会互相抵销。";
  } else if (good >= 4) {
    title = "微光并不解释苦难";
    text = "你没有证明世界公正，也没有替任何人写完一生。但几扇窗后，有人开始用自己的声音说话。这已经不是你来时的那座城。";
  } else if (dark >= 4) {
    title = "雪覆盖了未回的信";
    text = "离开时，街道看上去比来时洁白。你知道那不意味着什么已被清理干净。有些敲门声，你将会在很久以后才听见。";
  } else {
    title = "未竟之书";
    text = "你做过一些有用的事，也错过了一些不能重来的时刻。人并不因一个结局就被彻底解释。邮车向前，城市里的生活继续。";
  }

  openModal(`
    <div class="eyebrow" style="color:#75613d">第七日 · 邮车驶离彼得堡</div>
    <h2>${title}</h2>
    <p>${text}</p>
    <p class="muted">新道路 ${good}/6 · 良知 ${state.c}/10 · 剩余 ${state.m} 卢布</p>
    ${names.map(id => {
      const rank = state.fate[id] >= 5 && state.progress[id] >= 2 ? 2 : state.fate[id] >= 0 ? 1 : 0;
      return `
        <div class="ending-card">
          <div class="end-face">${portrait(id)}</div>
          <div>
            <h3>${people[id].name} · ${["风雪未歇", "门尚未关", "另一条路"][rank]}</h3>
            <p>${people[id].endings[rank]}</p>
          </div>
        </div>
      `;
    }).join("")}
    <p class="muted">这是你参与的一种可能，不是对他们一生的判决。</p>
    <button data-modal="close">返回手记</button>
    <button data-modal="restart">重写这六天</button>
  `);
}

function confirmRestart() {
  openModal(`
    <h2>重写这六天？</h2>
    <p>当前浏览器中的进度将被替换。那些未说出口的话，你可以再试一次。</p>
    <button data-modal="new">重新开始</button>
    <button data-modal="close">保留当前手记</button>
  `);
}

document.addEventListener("click", ev => {
  const place = ev.target.closest("[data-place]");
  if (place) visit(place.dataset.place);

  const choice = ev.target.closest("[data-choice]");
  if (choice) choose(Number(choice.dataset.choice));

  const action = ev.target.closest("[data-modal]");
  if (!action) return;

  switch (action.dataset.modal) {
    case "close":
      $("modal").close();
      break;
    case "restart":
      confirmRestart();
      break;
    case "new":
      state = fresh();
      loaded = false;
      save();
      render();
      $("modal").close();
      toast("雪还没有盖住第一个脚印。");
      break;
  }
});

document.addEventListener("keydown", ev => {
  if ($("modal").open || ev.ctrlKey || ev.altKey || ev.metaKey || ev.repeat) return;

  if (["1", "2", "3"].includes(ev.key)) {
    ev.preventDefault();
    choose(Number(ev.key) - 1);
  }
});

$("helpBtn").onclick = help;
$("restartBtn").onclick = confirmRestart;
$("endingBtn").onclick = showEnding;
$("restBtn").onclick = rest;

render();

if (!loaded) {
  help();
} else {
  toast(state.done ? "已找回你的终章。" : "已找回上次留下的手记。");
}
</script>


</body></html>
