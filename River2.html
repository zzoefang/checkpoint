<title>涅瓦河：未竟之书 · 双向命运版</title>
<style>
:root{
  --bg:#151917;
  --panel:#20261f;
  --paper:#e0d2b1;
  --muted:#aaa38d;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{

  color:var(--paper);
  background:var(--bg);
  font-family:"Songti SC","STSong",SimSun,serif;
  line-height:1.75;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:30;
  opacity:.045;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
}
button{

  background:#2b3027;

  border-radius:4px;

}
button:hover:not(:disabled){background:#3a3e30;border-color:var(--gold)}

button:disabled{cursor:not-allowed;opacity:.42}
small,.muted{color:var(--muted)}
header{
  max-width:1480px;
  margin:auto;
  padding:24px 24px 16px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold)}
h1{font-size:29px;font-weight:400;letter-spacing:.1em;margin:3px 0}
.subtitle{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.tools button{padding:7px 11px;font-size:12px}
.stats{
  max-width:1432px;
  margin:0 auto 16px;
  display:grid;
  grid-template-columns:1.6fr repeat(4,1fr);
  border:1px solid var(--line);
  background:#1c221c;
}
.stat{padding:10px 15px;border-right:1px solid #494b37}
.stat:last-child{border:0}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat strong{font-size:19px;font-weight:400}
main{
  max-width:1480px;
  margin:auto;
  padding:0 24px 24px;
  display:grid;
  grid-template-columns:255px minmax(340px,1fr) 295px;
  gap:16px;
  align-items:start;
}
.panel{border:1px solid var(--line);background:var(--panel)}
.panel+.panel{margin-top:16px}
.panel-title{
  padding:11px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid var(--line);

}
.panel-title small{font-size:10px}
.city{height:175px;overflow:hidden;border-bottom:1px solid var(--line)}
.city svg{width:100%;height:100%}
.locations{padding:9px;display:grid;gap:6px}
.place{text-align:left;padding:8px 10px}
.place.active{border-color:var(--gold);background:#3b3d2e}
.place b{display:block;font-size:13px;font-weight:400}
.place small{display:block;font-size:10px}
.place .num{float:right;color:var(--gold)}
.note{font-size:11px;color:var(--muted);padding:0 13px 12px}
.personal-grid{display:grid;grid-template-columns:1fr 1fr;padding:12px;gap:10px}
.mini{padding:7px 9px;background:#171e18;border:1px solid #424936}
.mini span{display:block;font-size:10px;color:var(--muted)}
.mini b{font-size:17px;font-weight:400}
.personal-status{padding:0 13px 13px;font-size:11px;color:var(--muted)}
.timeline{display:flex;gap:5px;padding:12px 13px}
.day-dot{
  flex:1;
  text-align:center;
  font-size:11px;
  border:1px solid #585840;
  padding:4px 0;

}
.day-dot.past{background:#384330;color:#c9d5b7}
.day-dot.now{border-color:var(--gold);color:var(--gold)}
.scene-head{padding:13px 19px;border-bottom:1px solid var(--line)}

}
.backdrop{position:absolute;inset:0;width:100%;height:100%}
.stage::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,#13201b88,transparent 70%),
             linear-gradient(0deg,#172018,transparent 50%);
}
.portrait{position:absolute;right:7%;bottom:-12px;width:178px;height:254px}
.portrait svg{width:100%;height:100%;filter:drop-shadow(-9px 4px 8px #0006)}
.caption{position:absolute;left:20px;bottom:19px;z-index:2;max-width:56%}
.caption strong{display:block;font-size:21px;font-weight:400}
.caption span{font-size:11px;color:#d0c7ad}
.snow{
  position:absolute;
  inset:-100% 0 0;
  z-index:3;
  pointer-events:none;
  opacity:.3;
  background-image:

    radial-gradient(1.3px 1.3px at 75px 80px,#fff 99%,transparent);
  background-size:110px 110px,173px 173px;
  animation:snow 16s linear infinite;
}
@keyframes snow{to{transform:translateY(110px)}}
.story{padding:18px 21px 13px}
.story h3{margin:0 0 9px;font-size:19px;font-weight:400;color:#efdfb5}
.story p{font-size:14px;line-height:1.95;margin:0;white-space:pre-line}
.phase-note{padding:0 21px 12px;font-size:11px;color:var(--gold)}
.outcome{
  margin:0 18px 15px;
  padding:11px 13px;
  border-left:2px solid var(--gold);
  background:#c6a77209;
  font-size:12px;
  white-space:pre-line;
}
.outcome:empty{display:none}
.choices{padding:0 18px 19px;display:grid;gap:8px}
.choice{display:flex;text-align:left;gap:10px;padding:11px 12px;align-items:flex-start}
.key{
  display:block;
  flex-shrink:0;
  min-width:23px;
  height:24px;
  border:1px solid #776c4f;
  text-align:center;
  font-size:12px;
  color:var(--gold);
}
.choice b{display:block;font-size:13px;font-weight:400}
.choice small{display:block;font-size:10px;margin-top:3px}
.cast-list{padding:9px;display:grid;gap:6px}
.person{
  display:grid;
  grid-template-columns:39px 1fr;
  gap:9px;
  padding:8px;
  width:100%;
  text-align:left;
}
.avatar{height:54px;overflow:hidden;background:#434a3c}
.avatar svg{width:46px;height:66px;margin-left:-3px}
.person-title{display:flex;justify-content:space-between;font-size:12px;gap:5px}
.person-title em{font-style:normal;color:var(--muted);font-size:10px}
.bar{height:3px;background:#121a13;margin:6px 0 3px}
.bar i{display:block;height:100%;background:var(--gold)}
.person small{font-size:10px;display:block}
.rest{width:calc(100% - 18px);margin:0 9px 11px;padding:9px;font-size:11px}
.entries{padding:11px 13px;max-height:340px;overflow:auto}
.entry{font-size:11px;border-bottom:1px dashed #50543c;padding-bottom:9px;margin-bottom:10px}
.entry small{font-size:10px;display:block;color:var(--gold)}
.echo-card{
  margin:0 18px 16px;
  padding:14px;
  border:1px solid #8c7952;
  background:#17221d;
}
.echo-top{display:flex;align-items:center;gap:13px}
.die{
  display:grid;
  place-items:center;
  width:55px;
  height:55px;
  flex-shrink:0;
  font-size:32px;
  line-height:1;
  border:1px solid var(--gold);
  background:#ded0ad;
  color:#263126;
  border-radius:7px;
}
.echo-math{font-size:12px}
.echo-origin{font-size:11px;color:var(--muted);margin:11px 0 0}
.echo-changes{font-size:12px;color:var(--green);margin-top:9px}
.save-warning{
  max-width:1432px;
  margin:0 auto 12px;
  padding:8px 12px;
  background:#422f28;
  color:#e8c1a7;
  font-size:12px;
  border:1px solid #8e6553;
}
footer{text-align:center;color:#9b967f;font-size:10px;padding:0 20px 24px}
dialog{
  width:min(780px,calc(100% - 28px));
  max-height:88vh;
  padding:27px;
  color:#302e24;
  background:#e1d4b5;
  border:1px solid #b49c6c;
  box-shadow:0 25px 90px #0009;
}
dialog::backdrop{background:#08100ddc}
dialog h2{font-size:25px;font-weight:400;margin:0 0 13px}
dialog h3{font-size:16px;font-weight:400}
dialog p,dialog li{font-size:13px}
dialog .muted{color:#716951}
dialog button{padding:8px 14px;margin:8px 7px 0 0}
.ending-card{display:flex;gap:13px;padding:14px 0;border-top:1px solid #a19370}
.end-face{width:53px;min-width:53px;height:74px;overflow:hidden;background:#aaa88d}
.end-face svg{width:60px;height:86px;margin-left:-3px}
.ending-card h3{margin:0 0 5px}
.ending-card p{margin:0;font-size:12px}
.self-ending{
  padding:14px;
  margin:15px 0;
  background:#cfc3a3;
  border-left:3px solid #7e6842;
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  max-width:90vw;
  padding:10px 16px;
  color:#253025;
  background:#e2d3af;
  border:1px solid #aa9260;
  box-shadow:0 6px 30px #0007;
  font-size:12px;
}
@media(max-width:1150px){
  main{grid-template-columns:230px minmax(330px,1fr)}
  .right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .right .panel+.panel{margin-top:0}
  .stats,.save-warning{margin-left:24px;margin-right:24px}
  .cast-list{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  header{padding:17px 14px;align-items:flex-start}
  h1{font-size:22px}
  .eyebrow{font-size:8px}
  .subtitle{font-size:10px}
  .tools{max-width:110px}
  .tools button{font-size:10px;padding:5px 8px}
  .stats{margin:0 14px 13px;grid-template-columns:repeat(4,1fr)}
  .stat{padding:7px 9px}
  .stat:first-child{grid-column:1/-1;border-bottom:1px solid #494b37;border-right:0}
  .stat:first-child span,.stat:first-child strong{display:inline;margin-right:10px}
  .stat strong{font-size:16px}
  .stat span{font-size:10px}
  .save-warning{margin-left:14px;margin-right:14px}
  main{padding:0 14px 20px;display:flex;flex-direction:column;gap:14px}
  .left,.right,.center{width:100%}
  .left{display:grid;grid-template-columns:1fr}
  .city{height:95px}
  .locations{grid-template-columns:repeat(3,1fr);gap:5px}
  .place:first-child{grid-column:1/-1}
  .place{padding:6px 8px}
  .place b{font-size:11px}
  .place small{font-size:9px}
  .personal-grid{grid-template-columns:repeat(4,1fr);gap:5px}

  .mini b{font-size:15px}

  .stage{height:220px}
  .portrait{right:2%;height:230px}
  .caption{left:15px;max-width:55%}
  .caption strong{font-size:19px}
  .story{padding:16px}
  .choices{padding:0 13px 15px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">НЕВА · NO LIFE IS ONLY A SIDE STORY</div>
    <h1>涅瓦河：未竟之书</h1>
    <div class="subtitle">你经过他们的人生，他们也会改变你的去向。</div>
  </div>
  <div class="tools">
    <button id="helpBtn">玩法</button>
    <button id="archiveBtn">回馈簿</button>
    <button id="endingBtn" hidden="">阅读终章</button>
    <button id="restartBtn">重新开始</button>
  </div>
</header>

<div class="save-warning" id="saveWarning" hidden="">
  当前浏览器未允许存档。本页内仍可游玩，但关闭或刷新可能丢失进度。
</div>

<section class="stats" aria-label="当前状态">
  <div class="stat"><span id="weather"></span><strong id="clock"></strong></div>
  <div class="stat"><span>卢布</span><strong id="money"></strong></div>
  <div class="stat"><span>良知</span><strong id="conscience"></strong></div>
  <div class="stat"><span>心力</span><strong id="spirit"></strong></div>
  <div class="stat"><span>警方疑心</span><strong id="suspicion"></strong></div>
</section>

<main>
  <aside class="left">
    <section class="panel">
      <div class="panel-title">彼得堡的七扇门 <small>切换不耗时</small></div>
      <div class="city" id="city"></div>
      <nav class="locations" id="locations" aria-label="地点"></nav>
      <div class="note">每日私人篇章不耗行动；探访、个人事务和抄写均消耗一次行动。</div>
    </section>

    <section class="panel">
      <div class="panel-title">你自己的那一页 <small id="saveStatus">自动存档</small></div>
      <div class="timeline" id="timeline"></div>
      <div class="personal-grid">
        <div class="mini"><span>书稿</span><b id="ink"></b></div>
        <div class="mini"><span>旧债</span><b id="debt"></b></div>
        <div class="mini"><span>家书 / 牵挂</span><b id="home"></b></div>
        <div class="mini"><span>本地生计</span><b id="work"></b></div>
      </div>
      <div class="personal-status" id="personalStatus"></div>
    </section>
  </aside>

  <section class="panel center" id="scenePanel">
    <div class="scene-head">
      <small id="sceneTag"></small>
      <h2 id="placeTitle"></h2>
    </div>

    <div class="stage">
      <svg class="backdrop" viewBox="0 0 680 280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

            <stop offset="1" stop-color="#838373"></stop>

        <path fill="url(#sky)" d="M0 0H680V280H0Z"></path>

        <g fill="#35423d" stroke="#8e9481" stroke-width=".7">
          <path d="M0 79H112V232H0Z M124 103H218V231H124Z M231 65H374V238H231Z M388 93H513V238H388Z M528 58H680V245H528Z"></path>
          <path d="M0 79L54 55L112 79 M231 65L302 40L374 65 M528 58L601 32L680 58"></path>
        </g>
        <g fill="#d1b374" opacity=".55">
          <path d="M23 105H36V129H23Z M69 106H82V130H69Z M25 155H38V177H25Z M154 129H167V151H154Z M270 94H284V117H270Z M318 96H332V119H318Z M318 147H332V171H318Z M424 123H437V148H424Z M470 167H484V191H470Z M559 87H572V111H559Z M610 129H624V153H610Z"></path>
        </g>
        <path d="M0 234Q300 203 680 247V280H0Z" fill="#929b87"></path>
        <path d="M0 250Q320 224 680 261" fill="none" stroke="#d0cdb3" opacity=".4"></path>
        <path d="M97 259V95 M81 119H114" fill="none" stroke="#253329" stroke-width="5"></path>
        <path d="M86 86H109L106 113H90Z" fill="#dfbd76" opacity=".7"></path>
        <path d="M0 271L680 260" stroke="#293a2d" stroke-width="11"></path>
      </svg>
      <div class="portrait" id="portrait"></div>
      <div class="caption">
        <strong id="charName"></strong>
        <span id="charSubtitle"></span>
      </div>
      <div class="snow"></div>
    </div>

    <div class="story" id="story"></div>
    <div class="phase-note" id="phaseNote"></div>
    <div id="echoBox"></div>
    <div class="outcome" id="outcome" role="status" aria-live="polite"></div>

  <aside class="right">
    <section class="panel">
      <div class="panel-title">与你相交的命运 <small>命运 ≠ 对你的信任</small></div>
      <div class="cast-list" id="cast"></div>
      <button class="rest" id="restBtn">替书商抄写 · 卢布 +1 / 心力 +2 / 消耗一次行动</button>
    </section>

    <section class="panel">
      <div class="panel-title">抄写员手记 <small>选择 · 回馈 · 因果</small></div>
      <div class="entries" id="journal" aria-live="polite"></div>
    </section>
  </aside>
</main>

<footer>
  跨作品架空叙事 · 对话均为游戏原创，非原著引文 · 数字键 1—5 选择 · 骰子结果随进度保存
</footer>

<dialog id="modal" aria-label="游戏信息"></dialog>
<div class="toast" id="toast" hidden="" role="status"></div>

<script>

function initialSeed(){
  let n = 0;
  try{
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    n = a[0];
  }catch{
    n = (Date.now() ^ Math.floor(Math.random()*4294967296)) >>> 0;
  }
  return n || 2463534242;
}

/* =========================================================
   存档：只接受结构与取值合法的本版本数据
========================================================= */

function validSave(s){
  if(!s || s.version!==2) return false;
  if(!Number.isInteger(s.rng) || s.rng<=0 || s.rng>4294967295) return false;
  if(!Number.isInteger(s.day) || s.day<1 || s.day>6) return false;
  if(!Number.isInteger(s.ap) || s.ap<0 || s.ap>3) return false;
  if(!PHASES.includes(s.phase) || !["self",...IDS].includes(s.loc)) return false;

  for(const [k,[min,max]] of Object.entries(LIMITS)){
    if(!Number.isInteger(s[k]) || s[k]<min || s[k]>max) return false;
  }

  const ranges={
    progress:[0,2],fate:[-8,10],trust:[-4,6],
    visited:[0,18],echoCount:[0,2]
  };
  for(const [key,[min,max]] of Object.entries(ranges)){
    if(!s[key]) return false;
    for(const id of IDS){
      const n=s[key][id];
      if(!Number.isInteger(n) || n<min || n>max) return false;
    }
  }

  if(!s.memory) return false;
  for(const id of IDS){
    const v=s.memory[id];
    if(v!==null && (
      !v || !Number.isInteger(v.day) || v.day<1 || v.day>6 ||
      typeof v.text!=="string" ||
      !["care","harm","neutral"].includes(v.kind)
    )) return false;
  }

  if(!Array.isArray(s.today) || s.today.length>3 || !s.today.every(id=>IDS.includes(id))) return false;
  if(!Array.isArray(s.chapters) || s.chapters.length>6) return false;
  if(!s.chapters.every((x,i)=>x && x.day===i+1 && typeof x.text==="string")) return false;
  if(!Array.isArray(s.logs) || s.logs.length>200) return false;
  if(!s.logs.every(x=>x && Number.isInteger(x.day) && x.day>=1 && x.day<=6 &&
    typeof x.text==="string" && typeof x.kind==="string")) return false;

  const validEcho = x => x &&
    Number.isInteger(x.day) && x.day>=1 && x.day<=6 &&
    ["self",...IDS].includes(x.id) &&
    Number.isInteger(x.roll) && x.roll>=1 && x.roll<=6 &&
    Number.isInteger(x.score) &&
    ["good","mixed","bad"].includes(x.tier) &&
    ["title","text","origin","formula","changes"].every(k=>typeof x[k]==="string");

  if(!Array.isArray(s.echoes) || s.echoes.length>6 || !s.echoes.every(validEcho)) return false;
  if(s.echo!==null && !validEcho(s.echo)) return false;

  if(!s.flags) return false;
  for(const k of ["promise","contract","contractSettled","delivered","ticket","sold"]){
    if(typeof s.flags[k]!=="boolean") return false;
  }
  if(!["none","safe","exposed","sealed"].includes(s.flags.publication)) return false;
  if(!["undecided","leave","stay"].includes(s.flags.plan)) return false;
  if(typeof s.last!=="string") return false;

  const chapterCount = s.phase==="chapter" ? s.day-1 : s.day;
  if(s.chapters.length!==chapterCount) return false;

  if(s.phase==="chapter" && s.ap!==3) return false;
  if(s.phase==="play" && s.ap<1) return false;
  if(["echo","done"].includes(s.phase) && s.ap!==0) return false;
  if(s.phase==="done" && s.day!==6) return false;
  if(s.phase==="echo" && (!s.echo || s.echo.day!==s.day)) return false;

  const expectedEchoes=["echo","done"].includes(s.phase) ? s.day : s.day-1;
  if(s.echoes.length!==expectedEchoes) return false;

  return true;
}

function random(){
  let x=state.rng>>>0;
  x ^= x<<13;
  x ^= x>>>17;
  x ^= x<<5;
  state.rng=x>>>0;
  return state.rng/4294967296;
}

/* =========================================================
   选择与效果
   effects: 主角数值
   f: 人物命运
   r: 人物对主角的信任
   flags: 主角剧情标记
   req: 解锁条件
   kind: 留在人物记忆中的性质
========================================================= */

function O(text,hint,effects,f,result,extra={}){
  return {text,hint,effects,f,result,kind:"care",...extra};
}
function S(title,text,options){
  return {title,text,options};
}

function blockedReason(o){
  if(o.req){
    const result=o.req();
    if(result!==true) return result || "尚未满足条件";
  }
  for(const key of ["m","e"]){
    const delta=o.effects[key]||0;
    if(state[key]+delta<0) return key==="m" ? "卢布不足" : "心力不足，可先抄写";
  }
  return "";
}

function apply(o){
  const changes=[];

  for(const [key,delta] of Object.entries(o.effects||{})){
    const before=state[key];
    const [min,max]=LIMITS[key];
    state[key]=clamp(before+delta,min,max);
    const actual=state[key]-before;
    if(actual) changes.push(LABELS[key]+" "+signed(actual));
  }

  for(const [id,delta] of Object.entries(o.f||{})){
    const before=state.fate[id];
    state.fate[id]=clamp(before+delta,-8,10);
    const actual=state.fate[id]-before;
    if(actual) changes.push(PEOPLE[id].short+"命运 "+signed(actual));
  }

  for(const [id,delta] of Object.entries(o.r||{})){
    const before=state.trust[id];
    state.trust[id]=clamp(before+delta,-4,6);
    const actual=state.trust[id]-before;
    if(actual) changes.push(PEOPLE[id].short+"信任 "+signed(actual));
  }

  if(o.flags) Object.assign(state.flags,o.flags);
  return changes.length ? changes.join(" · ") : "数值未变";
}

function npcScene(id){
  if(state.progress[id]<2) return SCENES[id][state.progress[id]];

  return S(
    "故事之外的一小时",
    `${PEOPLE[id].short}已经向你说过一些难以启齿的话。你也不再隐藏自己所有的困难。\n一次相逢不一定要发生转折，但仍然可以决定：你们是继续成为彼此生活中的人，还是只在需要时出现。`,

      O("留下听一会儿，也谈谈自己的近况",
        "心力 −2 · 此人命运 +1 / 信任 +1",
        {e:-2},{[id]:1},

function pickEchoPerson(){
  const pool=IDS.filter(id=>state.visited[id]>0 && state.echoCount[id]<2);
  if(!pool.length) return "self";

  const weights=pool.map(id=>
    1+
    (state.echoCount[id]===0 ? 3 : 0)+
    (state.today.includes(id) ? 2 : 0)+
    (Math.abs(state.trust[id])>=2 ? 1 : 0)
  );

  let ticket=random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){
    ticket-=weights[i];
    if(ticket<0) return pool[i];
  }
  return pool[pool.length-1];
}

function resolveDusk(){
  const id=pickEchoPerson();
  const roll=1+Math.floor(random()*6);

  let trustMod=0;
  let situationMod=0;
  const suspicionMod=state.s>=6 ? -1 : 0;

  if(id!=="self"){
    const trust=state.trust[id];
    trustMod=trust>=3 ? 2 : trust>=1 ? 1 : trust<=-2 ? -1 : 0;
    situationMod=state.fate[id]>=5 ? 1 : state.fate[id]<0 ? -1 : 0;
  }

  const score=roll+trustMod+situationMod+suspicionMod;
  const tier=score>=5 ? "good" : score>=3 ? "mixed" : "bad";

  let data;
  let origin;
  let formula;

  if(id==="self"){
    const solo={
      good:{
        title:"没人敲门的好消息",
        text:"书商清理旧账时发现少付了你两卢布。你收到补款，又在安静的夜里整理出一页书稿。即使没有相识的人来访，城市也并非完全停止运转。",
        effects:{m:2,ink:1},f:{}
      },
      mixed:{
        title:"平静经过的一晚",
        text:"没有意外来信，也没有人请求你帮忙。你为自己生起炉火，终于有一会儿不必证明什么。",
        effects:{e:1},f:{}
      },
      bad:{
        title:"漏水落在稿纸上",
        text:"房顶的融雪漏进来，浸坏一页来不及誊清的草稿。你搬动书桌忙到深夜。倒霉并不总是某个人的错。",
        effects:{ink:-1,e:-1},f:{}
      }
    };
    data=solo[tier];
    origin="当前没有仍可触发回馈的已结识人物，因此触发主角独自生活中的偶发事件。";
    formula=`1d6 = ${roll}；疑心修正 ${signed(suspicionMod)}；合计 ${score}`;
  }else{
    const source=ECHO_DATA[id][tier];
    const isHurt=state.trust[id]<0 || state.memory[id]?.kind==="harm";
    data={
      ...source,
      text:tier==="bad" && isHurt ? source.harmful : source.text
    };

    const mem=state.memory[id];
    origin=mem
      ? `关联旧事：第 ${mem.day} 日，你选择“${mem.text}”。对方记得这段相处，但回馈也受现实处境影响。`
      : "关联旧事：你此前曾与这个人相逢。";

    formula=`1d6 = ${roll}；信任 ${signed(trustMod)}；对方处境 ${signed(situationMod)}；疑心 ${signed(suspicionMod)}；合计 ${score}`;
    state.echoCount[id]++;
  }

  const changes=apply(data);
  const echo={
    day:state.day,id,roll,score,tier,
    title:data.title,text:data.text,
    origin,formula,changes
  };

  state.echo=echo;
  state.echoes.push(echo);
  state.phase="echo";
  state.loc=id;
  state.last="";

  log("黄昏回馈",`${data.title}。${formula}。${data.text}〔${changes}〕`);
}

    4:[
      ["ivan","酒馆的人说他又独自待到了打烊。"],
      ["alyosha","承担太多事情，他错过了一次与孩子们的约定。"]
    ]
  };

  for(const [id,text] of pressures[state.day]||[]){
    if(state.visited[id]===0){
      const changes=apply({effects:{},f:{[id]:-1}});
      log("城中消息",PEOPLE[id].short+"："+text+"〔"+changes+"〕");
    }
  }

  if(state.s>=6){
    const changes=apply({effects:{e:-2,s:-2},f:{}});
    log("盘问","警方在清晨拦下你。解释没有耗去常规行动，却耗费了心力。〔"+changes+"〕");
  }

  if(state.day===5){
    for(const [from,to] of [["sonya","rodion"],["nastasya","myshkin"],["alyosha","ivan"]]){
      if(state.fate[from]>=4){
        const changes=apply({effects:{},f:{[to]:1}});
        log("他们的选择",
          `${PEOPLE[from].short}主动去见了${PEOPLE[to].short}。你不在场，他们也会选择彼此。〔${changes}〕`);
      }
    }
  }

  if(state.day===6){
    log("期限","这是邮车出发前的最后一天。今日仍有一次私人篇章、三次常规行动，以及一次黄昏回馈。");
  }
}

function spendTime(){
  state.ap--;
  if(state.ap===0) resolveDusk();
  save();
  render();
}

function chooseChapter(index){
  if(state.phase!=="chapter") return;
  const sc=chapterScene();
  const o=sc.options[index];
  if(!o || blockedReason(o)) return;

  const changes=apply(o);
  state.chapters.push({day:state.day,text:o.text});
  state.last=o.result+"\n〔"+changes+"〕";
  log("私人篇章",o.text+"。"+o.result+"〔"+changes+"〕");

  if(state.day===5){
    if(state.flags.publication==="exposed"){
      for(const id of IDS){
        if(state.visited[id]>0){
          state.memory[id]={
            day:5,
            text:"将可辨认的私人细节交给书商刊印",
            kind:"harm"
          };
        }
      }
    }

    if(state.flags.contract && !state.flags.contractSettled){
      if(!state.flags.delivered){
        const debtChange=apply({effects:{debt:3},f:{}});
        log("交稿约定","未交稿，三卢布预付款转为旧债。〔"+debtChange+"〕");
        state.last+="\n未履行交稿约定：三卢布预付款已转为旧债。";
      }else{
        log("交稿约定","稿件已交付，预付款不必退还。");
      }
      state.flags.contractSettled=true;
    }
  }

  state.phase="play";
  state.loc="self";
  save();
  render();
}

function chooseNPC(index){
  if(state.phase!=="play" || !IDS.includes(state.loc)) return;
  const id=state.loc;
  const o=npcScene(id).options[index];
  if(!o || blockedReason(o)) return;

  const changes=apply(o);
  state.progress[id]=Math.min(2,state.progress[id]+1);
  state.visited[id]++;
  if(!state.today.includes(id)) state.today.push(id);
  state.memory[id]={day:state.day,text:o.text,kind:o.kind||"care"};
  state.last=o.result+"\n〔"+changes+"〕";
  log("相逢",PEOPLE[id].short+"："+o.text+"。"+o.result+"〔"+changes+"〕");
  spendTime();
}

function choosePersonal(index){
  if(state.phase!=="play") return;
  const o=personalScene().options[index];
  if(!o || blockedReason(o)) return;

  const changes=apply(o);
  state.last=o.result+"\n〔"+changes+"〕";
  log("自己的生活",o.text+"。"+o.result+"〔"+changes+"〕");
  spendTime();
}

function acknowledgeEcho(){
  if(state.phase!=="echo") return;

  if(state.day===6){
    state.phase="done";
    state.loc="self";
    state.last="最后一夜已经过去。你和他们的故事都没有被这一页彻底解释。";
    log("终章","第七日的邮车铃声从远处传来。你的六天结束了，城市里的人仍在生活。");
    save();
    render();
    showEnding();
    return;
  }

  state.day++;
  state.ap=3;
  state.phase="chapter";
  state.loc="self";
  state.today=[];
  state.echo=null;
  state.last="";
  dawn();
  save();
  render();
}

function visit(id){
  if(!["play","done"].includes(state.phase)) return;
  if(!["self",...IDS].includes(id)) return;
  state.loc=id;
  state.last="";
  save();
  render();
}

/* =========================================================
   界面渲染
========================================================= */

function renderChoices(options,action){
  return options.map((o,i)=>{
    const reason=blockedReason(o);
    return `<button class="choice" data-action="${action}" data-index="${i}" ${reason ? "disabled" : ""}>
      <span class="key">${i+1}</span>
      <span>
        <b>${esc(o.text)}</b>
        <small>${esc(o.hint)}${reason ? " · 未解锁："+esc(reason) : ""}</small>
      </span>
    </button>`;
  }).join("");
}

function echoHTML(e){
  const label={good:"正向回馈",mixed:"混合回馈",bad:"负向回馈"}[e.tier];
  return `<div class="echo-card">
    <div class="echo-top">
      <div class="die" aria-label="骰子点数 ${e.roll}">${e.roll}</div>
      <div class="echo-math">
        <b>${label} · ${e.id==="self" ? "生活的偶发事件" : PEOPLE[e.id].short+"的回应"}</b><br>
        ${esc(e.formula)}<br>
        <small>总分 ≥5 正向；3—4 混合；≤2 负向</small>
      </div>
    </div>
    <p class="echo-origin">${esc(e.origin)}</p>
    <div class="echo-changes">实际变化：${esc(e.changes)}</div>
    <div class="echo-origin">这次结果已结算并写入存档；确认只负责翻页，不会再投一次。</div>
  </div>`;
}

function render(){
  const phase=state.phase;
  const canTravel=["play","done"].includes(phase);

  $("clock").textContent=phase==="done"
    ? "六日已尽"
    : `第 ${state.day} 日 · 余 ${state.ap} 次行动`;

  const weathers=["薄雪","浓雾","冷雨","霜冻","北风","雪停"];
  const time=phase==="chapter" ? "私人篇章" :
    phase==="echo" ? "黄昏回馈" :
    phase==="done" ? "邮车的清晨" :
    ({3:"清晨",2:"午后",1:"傍晚"}[state.ap]);

  $("weather").textContent=weathers[state.day-1]+" · "+time;
  $("money").textContent=state.m;
  $("conscience").textContent=state.c+" / 10";
  $("spirit").textContent=state.e+" / 10";
  $("suspicion").textContent=state.s+" / 10";
  $("suspicion").style.color=state.s>=6 ? "var(--red)" : "";

  $("ink").textContent=state.ink+" / 12";
  $("debt").textContent=state.debt+" 卢布";
  $("home").textContent=state.home+" / 10";
  $("work").textContent=state.work+" / 10";

  $("timeline").innerHTML=Array.from({length:6},(_,i)=>{
    const day=i+1;
    return `<div class="day-dot ${day<state.day || phase==="done" ? "past" : day===state.day ? "now" : ""}" title="${CHAPTER_NAMES[i]}">${day} 日</div>`;
  }).join("");

  const plan={undecided:"尚未决定去留",leave:"准备返乡",stay:"决定留下"}[state.flags.plan];
  const publication={none:"尚未处理出版",safe:"已交匿名整理稿",exposed:"已交具名细节稿",sealed:"暂不出版"}[state.flags.publication];
  const contract=state.flags.contract
    ? state.flags.contractSettled
      ? state.flags.delivered ? "交稿约定：已履行" : "交稿约定：预付款已转旧债"
      : "第五日须交稿，否则旧债 +3"
    : "未收预付款";

  $("personalStatus").textContent=
    `${plan} · ${state.flags.ticket ? "已有车票" : "尚无车票"}\n`+
    `${publication} · ${contract}`;
  $("personalStatus").style.whiteSpace="pre-line";

  $("city").innerHTML=cityMap();
  $("locations").innerHTML=["self",...IDS].map((id,i)=>`
    <button class="place ${state.loc===id ? "active" : ""}" data-place="${id}" ${canTravel ? "" : "disabled"} aria-pressed="${state.loc===id}">
      <span class="num">${id==="self" ? "我" : i}</span>
      <b>${PEOPLE[id].place}</b>
      <small>${id==="self" ? "私人时间线 · 书稿 / 家书 / 还债 / 工作" : `${PEOPLE[id].short} · ${state.progress[id]}/2 关键故事`}</small>
    </button>
  `).join("");

  $("cast").innerHTML=IDS.map(id=>`
    <button class="person" data-place="${id}" ${canTravel ? "" : "disabled"}>
      <div class="avatar">${portrait(id)}</div>
      <div>
        <div class="person-title">${PEOPLE[id].short}<em>${state.progress[id]}/2 · 回馈 ${state.echoCount[id]}/2</em></div>
        <div class="bar"><i style="width:${(state.fate[id]+8)/18*100}%;background:${state.fate[id]<0 ? "var(--red)" : "var(--gold)"}"></i></div>
        <small>${fateLabel(state.fate[id])} ${signed(state.fate[id])}</small>
        <small>信任 ${signed(state.trust[id])} · ${trustLabel(state.trust[id])}</small>
      </div>
    </button>
  `).join("");

  let id=state.loc;
  let sc;
  let choices="";
  let tag="";
  let phaseNote="";
  let echoContent="";

  if(phase==="chapter"){
    id="self";
    sc=chapterScene();
    choices=renderChoices(sc.options,"chapter");
    tag=`你的时间线 · 第 ${state.day} / 6 章`;
    phaseNote="先完成今日私人篇章，再自由行动。本次选择不消耗行动次数。";
  }else if(phase==="echo"){
    id=state.echo.id;
    sc=S(state.echo.title,state.echo.text,[]);
    echoContent=echoHTML(state.echo);
    tag=`第 ${state.day} 日黄昏 · 双向回馈`;
    phaseNote="今日三次行动结束。无论好坏，这也是你的人生正在回应你。";
    choices=`<button class="choice" data-action="ack">
      <span class="key">1</span>
      <span><b>${state.day===6 ? "收好这最后一封信，走向终章" : "记下这次回馈，进入下一天"}</b>
      <small>不耗行动 · 不重复结算</small></span>
    </button>`;
  }else if(phase==="done"){
    sc=id==="self"
      ? S("你也是这本书里的人",
          "六次私人篇章、十八次常规行动、六次黄昏意外已经走完。\n你可以翻阅人物状态、完整手记与回馈簿，也可以重新阅读主角和六个人的终章。",[])
      : S("书页暂合，他们继续生活",
          PEOPLE[id].endings[endingRank(id)]+`\n\n你们最终的信任：${signed(state.trust[id])}。他们的处境与他们如何看你，并不是同一个结局。`,[]);
    tag="第七日 · 余下的生活";
    phaseNote="本周目已结束。查看地点和人物不改变存档结果。";
    choices=`<button class="choice" data-action="ending"><span class="key">1</span><span><b>阅读完整终章</b><small>包含主角去向、关系余波与人物结局</small></span></button>`;
  }else if(id==="self"){
    sc=personalScene();
    choices=renderChoices(sc.options,"personal");
    tag=`你自己的生活 · 第 ${state.day} 日`;
    phaseNote="这些事务与探访人物共享当天的三次行动。选择照顾自己不会扣良知。";
  }else{
    sc=npcScene(id);
    choices=renderChoices(sc.options,"npc");
    tag=`${PEOPLE[id].source} · ${state.progress[id]<2 ? "关键故事 "+(state.progress[id]+1)+" / 2" : "日常相伴"}`;
    phaseNote=`对方命运 ${signed(state.fate[id])} · 对你的信任 ${signed(state.trust[id])} · 已发生回馈 ${state.echoCount[id]} / 2`;
  }

  $("placeTitle").textContent=PEOPLE[id].place;
  $("sceneTag").textContent=tag;
  $("portrait").innerHTML=portrait(id);
  $("charName").textContent=PEOPLE[id].name;
  $("charSubtitle").textContent=PEOPLE[id].role;
  $("story").innerHTML=`<h3>${esc(sc.title)}</h3><p>${esc(sc.text)}</p>`;
  $("phaseNote").textContent=phaseNote;
  $("choices").innerHTML=choices;
  $("echoBox").innerHTML=echoContent;
  $("outcome").textContent=state.last;

  $("journal").innerHTML=state.logs.map(x=>`
    <div class="entry"><small>第 ${x.day} 日 · ${esc(x.kind)}</small>${esc(x.text)}</div>
  `).join("");

  $("restBtn").disabled=phase!=="play";
  $("endingBtn").hidden=phase!=="done";
  $("saveWarning").hidden=storageOK;
  $("saveStatus").textContent=storageOK ? "自动存档" : "仅本页保存";
}

/* =========================================================
   主角结局：去留、生计、债务、家书、书稿、伦理各自落地
========================================================= */

function endingRank(id){
  return state.fate[id]>=5 && state.progress[id]>=2
    ? 2 : state.fate[id]>=0 ? 1 : 0;
}

function protagonistEnding(){
  let title;
  let text;

  if(state.flags.plan==="leave"){
    if(state.debt===0 && state.home>=6){
      title="带着自己的名字回去";
      text="你登上邮车，口袋里有结清的收据，也有米拉知道你将回来的那封信。你不是功成名就地归乡，但这一次，回来不是躲藏。";
    }else if(state.home>=6){
      title="有人等待，旧债同行";
      text="米拉知道你会回来。你登车时仍带着欠款，却没有再假装债务会被路程抹去。有人等你，与有人替你承担一切，是两回事。";
    }else{
      title="车票能抵达，沉默不能";
      text="你买到了回去的路，却没能及时说清这些日子。邮车会抵达家乡，而你与米拉之间的那段距离，还需要亲自开口才能走完。";
    }
  }else{
    if(state.work>=5 && state.debt<=2){
      title="在城里留下一把自己的椅子";
      text="第七日，你没有去车站。你有了足以开始生活的工作线索，也把欠款压到可以面对的程度。留下终于不是因为无路可走。";
    }else if(state.work>=3){
      title="留下，但不把艰难写成浪漫";
      text="你留在彼得堡，手里有几份不稳定的工作。欠款与房租不会因为你下定决心而消失，但至少你知道明天先去敲哪一扇门。";
    }else{
      title="错过邮车以后";
      text="你决定留下，却还没有真正建立生计。邮车铃声远去时，城里并没有自动替你空出一个位置。接下来，你需要的是工作和诚实的求助，而不只是决心。";
    }
  }

  const details=[];

  details.push(state.debt===0
    ? "债务：你留下了结清的凭据。至少这一项旧事，没有再被推给明天。"
    : `债务：仍欠 ${state.debt} 卢布。结局没有替你免除它，今后的收入仍需要先分出一部分。`);

  if(state.home>=7){
    details.push("家人：你与米拉有了更具体的通信。你知道她的难处，她也知道你的；你们不再只用“我很好”互相保护。");
  }else if(state.home>=4){
    details.push("家人：通信还在继续，但有些问题仍没有说透。至少你没有把对方完全留在沉默里。");
  }else{
    details.push("家人：米拉收到的解释太少。你关心陌生人的许多时刻，并不能自动抵消这份疏远。");
  }

  if(state.flags.promise && state.flags.plan==="stay"){
    details.push("承诺：你没有实现第一日的返乡打算，但最后寄出了说明。米拉是否原谅，要留给下一封信，而不是由你替她决定。");
  }

  if(state.ink>=8){
    details.push("书稿：你写成了一部有轮廓的作品。它还需要修改，却不再只是“将来总会写完”的愿望。");
  }else if(state.ink>=4){
    details.push("书稿：留下的稿页足以成为开头。你终于明白，未完成也可以是一种真实状态，而不必伪装成宏大的计划。");
  }else{
    details.push("书稿：纸页仍然稀薄。六天里发生的事没有自动变成一本书，你还需要重新坐下来写。");
  }

  if(state.flags.publication==="exposed"){
    details.push("署名：刊印换来稿费，也把他人的私人处境推向人群。某些人从此不再愿意向你说真话。");
  }else if(state.flags.publication==="safe"){
    details.push("署名：你交出了删改辨认细节的稿件。保护别人不是一次选择就彻底完成的事，往后的校样仍需要你的坚持。");
  }else{
    details.push("署名：你暂时保留了那些故事，没有让出版期限替你决定什么可以公开。");
  }

  if(state.flags.contract){
    details.push(state.flags.delivered
      ? "约定：你履行了与书商的交稿约定。至于履约的方式是否值得，你已经在别人眼里看见一部分答案。"
      : "约定：你没有交稿，预付款已经记入旧债。拒绝有时是必要的，但代价没有因此消失。");
  }

  if(state.flags.sold){
    details.push("车票：有三页手稿换成了归途。你失去的是已有的纸页，不是重新写作的资格。");
  }

  details.push(state.s>=6
    ? "处境：你的名字仍引人注意。第七日之后，无论去留，你都还需要解释这几天卷入的事情。"
    : "处境：至少在离开这一页时，没有新的盘问紧紧跟在身后。");

  const close=IDS.filter(id=>state.trust[id]>=3);
  const hurt=IDS.filter(id=>state.trust[id]<0);

  details.push(close.length
    ? "关系："+close.map(id=>PEOPLE[id].short).join("、")+"愿意继续与你通信。这些联系不会保证好运，却意味着你不再完全独自生活。"
    : "关系：你还没有建立足以托付的长期联系。相逢发生过，信任却需要更多时间。");

  if(hurt.length){
    details.push("余波："+hurt.map(id=>PEOPLE[id].short).join("、")+"对你仍有芥蒂。他们可能过得更好，却不代表他们会因此原谅你。");
  }

  if(state.c<=2){
    details.push("自省：你知道怎样把别人的难处换成自己的便利。手记保存了那些收益，也保存了它们的来处。");
  }else if(state.c>=8){
    details.push("自省：你并没有总能兼顾一切，但多次拒绝了把别人当作手段。那不能偿清所有债，却决定了你愿意怎样署名。");
  }else{
    details.push("自省：你做过有用的事，也作过自私的决定。它们不会互相抵消，接下来的生活还会继续询问你。");
  }

  return {title,text,details};
}

function openModal(html){
  const d=$("modal");
  if(d.open) d.close();
  d.innerHTML=html;
  d.showModal();
}

function showEnding(){
  if(state.phase!=="done") return;
  const me=protagonistEnding();
  const good=IDS.filter(id=>endingRank(id)===2).length;
  const positive=state.echoes.filter(e=>e.tier==="good").length;
  const negative=state.echoes.filter(e=>e.tier==="bad").length;

  openModal(`
    <div class="eyebrow" style="color:#7b6844">第七日 · 每个人都还有下一页</div>
    <h2>${me.title}</h2>
    <p>${me.text}</p>
    <p class="muted">人物新道路 ${good}/6 · 正向回馈 ${positive} · 负向回馈 ${negative} · 良知 ${state.c}/10</p>

    <div class="self-ending">
      <h3>你的生活没有被省略</h3>
      ${me.details.map(t=>`<p>${esc(t)}</p>`).join("")}
    </div>

    <h3>六天里，你为自己作过的决定</h3>
    <ol>${state.chapters.map(x=>`<li>第 ${x.day} 日：${esc(x.text)}</li>`).join("")}</ol>

    <h3>与你相交的六个人</h3>
    ${IDS.map(id=>{
      const rank=endingRank(id);
      const relation=state.trust[id]>=3
        ? "他／她愿意让你继续留在自己的生活里。"
        : state.trust[id]<0
        ? "他／她仍记得你造成的伤害，暂时不愿与你亲近。"
        : "你们并非全无联系，但这段关系还没有成为可以依靠的习惯。";

      return `<div class="ending-card">
        <div class="end-face">${portrait(id)}</div>
        <div>
          <h3>${PEOPLE[id].name} · ${["风雪未歇","门尚未关","另一条路"][rank]}</h3>
          <p>${PEOPLE[id].endings[rank]}</p>
          <p class="muted">命运 ${signed(state.fate[id])} · 信任 ${signed(state.trust[id])} · ${relation}</p>
        </div>
      </div>`;
    }).join("")}

    <p class="muted">这不是任何人一生的判决，只是你们彼此经过的六天。</p>
    <button data-modal="close">回到手记</button>
    <button data-modal="archive">翻阅回馈簿</button>
    <button data-modal="restart">重写这六天</button>
  `);
}

function showArchive(){
  openModal(`
    <div class="eyebrow" style="color:#7b6844">他们也曾向你伸出手，或收回信任</div>
    <h2>黄昏回馈簿</h2>
    <p class="muted">每天结束时生成一次，最多同一人物两次。骰子与实际变化均随存档保存。</p>
    ${state.echoes.length ? state.echoes.map(e=>`
      <div class="ending-card">
        <div>
          <h3>第 ${e.day} 日 · ${esc(e.title)}</h3>
          <p>${esc(e.text)}</p>
          <p class="muted">${esc(e.formula)} · ${esc(e.changes)}</p>
          <p class="muted">${esc(e.origin)}</p>
        </div>
      </div>
    `).join("") : "<p>第一天的黄昏尚未到来。先作出一些选择，城市才会开始回应。</p>"}
    <button data-modal="close">合上回馈簿</button>
    ${state.phase==="done" ? '<button data-modal="ending">返回终章</button>' : ""}
  `);
}

function help(){
  openModal(`
    <div class="eyebrow" style="color:#7b6844">双向命运版</div>
    <h2>你不是救世主，也不是一个没有生活的人。</h2>

    <p>你是一名无名抄写员。六天后有邮车离开彼得堡。妹妹米拉等你的消息；你欠着六卢布，也想完成自己的书稿。</p>

    <h3>一天怎样进行</h3>
    <ol>
      <li><b>私人篇章：</b>每天开始先处理一段主角剧情，不耗行动。</li>
      <li><b>三次常规行动：</b>探访人物、处理个人事务、替书商抄写，均消耗一次。切换地点免费。</li>
      <li><b>黄昏回馈：</b>当天第三次行动后，触发一次已经结算并保存的意外，再进入次日。</li>
    </ol>
    <p>六天共有 <b>18 次常规行动、6 次私人篇章和6次黄昏事件</b>。每日清晨恢复心力2点，最多10点。</p>

    <h3>你的生活</h3>
    <p><b>书稿</b>影响交稿和写作结局；<b>旧债</b>不会因为离城自动清零；<b>家书牵挂</b>代表与妹妹的沟通；<b>本地生计</b>决定留下是否有实际支撑。</p>
    <p>第五日处理出版。匿名交稿需书稿至少4页，保留私人细节交稿需至少2页。第六日选择去留：车票4卢布；也可在至少5页书稿时卖出3页换票，或留下并说明。</p>
    <p>照顾自己的事务不会扣良知。普通抄写恢复心力并赚1卢布，但不增加你自己的书稿。</p>

    <h3>他们怎样回应你</h3>
    <p><b>命运</b>是对方的处境，<b>信任</b>是对方如何看你，两者分开计算。帮助不保证回报，伤害也不会被一次资助自动抹去。</p>
    <p>黄昏从已探访的人物中抽取一人；当天见过、尚未回馈、关系较强的人更容易出现。同一人物最多回馈两次。没有符合条件的人时，触发主角独处事件。</p>
    <p><b>判定：1d6 + 信任修正 + 对方处境修正 + 疑心修正。</b></p>
    <ul>
      <li>信任至少3：+2；信任1—2：+1；信任≤−2：−1；其余0。</li>
      <li>对方命运至少5：+1；命运低于0：−1；其余0。</li>
      <li>你的疑心至少6：−1。</li>
      <li>总分≥5为正向，3—4为混合，≤2为负向。</li>
    </ul>
    <p>信任好仍可能帮倒忙，但不会无缘无故变成恶意背叛。事件会显示关联旧选择。数字达到上限或下限时，以事件显示的<b>实际变化</b>为准。</p>

    <h3>城市并不只围着你转</h3>
    <p>第二至第四日，部分未探访人物会因生活压力损失命运。第五日，处境较好的索尼娅、娜斯塔霞与阿辽沙可能主动帮助另一位人物。疑心达到6时，次日清晨盘问额外消耗2点心力，并降低2点疑心。</p>
    <p>人物命运至少5且完成两段关键故事，才能开启其“另一条路”。主角结局另按去留、生计、债务、家书、书稿、约定及良知描写。</p>

    <p class="muted">所有人物对话为架空创作，非原著引文。进度保存在当前浏览器。正常刷新不重投已保存的骰子；浏览器禁止存档时会显示警告。数字键1—5选择，弹窗打开时不触发剧情快捷键。</p>
    <button data-modal="close">${loaded ? "回到这座城" : "翻开你自己的第一页"}</button>
  `);
}

function confirmRestart(){
  openModal(`
    <h2>重写这六天？</h2>
    <p>当前双向命运版的进度将被替换，新的周目也会有新的随机序列。上一版游戏的存档不受影响。</p>
    <button data-modal="new">重新开始</button>
    <button data-modal="close">保留这本手记</button>
  `);
}

/* =========================================================
   交互：阶段校验 + 防连击，避免一击跨过两段剧情
========================================================= */

function actionAllowed(){
  if($("modal").open) return false;
  const now=performance.now();
  if(now-lastActionTime<350) return false;
  lastActionTime=now;
  return true;
}

function dispatch(action,index=0){
  if(!actionAllowed()) return;

  switch(action){
    case "chapter": chooseChapter(index); break;
    case "npc": chooseNPC(index); break;
    case "personal": choosePersonal(index); break;
    case "ack": acknowledgeEcho(); break;
    case "ending": showEnding(); break;
  }
}

document.addEventListener("click",ev=>{
  if(!(ev.target instanceof Element)) return;

  const modalAction=ev.target.closest("[data-modal]");
  if(modalAction){
    switch(modalAction.dataset.modal){
      case "close":
        $("modal").close();
        break;
      case "archive":
        showArchive();
        break;
      case "ending":
        showEnding();
        break;
      case "restart":
        confirmRestart();
        break;
      case "new":
        state=fresh();
        loaded=false;
        lastActionTime=performance.now();
        save();
        render();
        $("modal").close();
        toast("新的一页展开了。先写下你自己的第一项决定。");
        break;
    }
    return;
  }

  if($("modal").open) return;

  const place=ev.target.closest("[data-place]");
  if(place && !place.disabled){
    visit(place.dataset.place);
    return;
  }

  const choice=ev.target.closest("[data-action]");
  if(choice && !choice.disabled){
    dispatch(choice.dataset.action,Number(choice.dataset.index||0));
  }
});

document.addEventListener("keydown",ev=>{
  if($("modal").open || ev.ctrlKey || ev.altKey || ev.metaKey || ev.repeat) return;
  if(ev.target instanceof Element && ev.target.closest("input,textarea,select,[contenteditable]")) return;
  if(!["1","2","3","4","5"].includes(ev.key)) return;

  const buttons=[...$("choices").querySelectorAll("[data-action]")];
  const button=buttons[Number(ev.key)-1];
  if(!button || button.disabled) return;

  ev.preventDefault();
  dispatch(button.dataset.action,Number(button.dataset.index||0));
});

$("helpBtn").addEventListener("click",help);
$("archiveBtn").addEventListener("click",showArchive);
$("endingBtn").addEventListener("click",showEnding);
$("restartBtn").addEventListener("click",confirmRestart);
$("restBtn").addEventListener("click",()=>{
  if(state.phase==="play") dispatch("personal",4);
});

render();

if(!loaded){
  save();
  help();
  if(invalidStored) toast("旧存档数据不完整，已开启新的六日。");
}else{
  toast(state.phase==="echo"
    ? "已找回黄昏回馈：结果已保存，不会重新投骰。"
    : state.phase==="done"
    ? "已找回你和他们的终章。"
    : "已找回你的手记、私人时间线与关系记忆。");
}
</script>
