<title>未亡站 · 一份尚未生效的死亡证明</title>
<style>
:root{
  --bg:#171c20; --paper:#dfd5be; --muted:#9b9c91;
  --line:#ffffff19; --red:#d47963; --gold:#d8b570;
  --blue:#8fbbbf; --green:#a5b596;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--paper);
  font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
}
button{font:inherit}
button:focus-visible,summary:focus-visible{
  outline:2px solid var(--gold);outline-offset:4px;
}
button{touch-action:manipulation}
.shell{min-height:100vh;display:grid;grid-template-columns:43% 57%}
.art{
  position:sticky;top:0;height:100vh;overflow:hidden;
  background:#26383c;border-right:1px solid var(--line);
}
.art svg{width:100%;height:100%;object-fit:cover;display:block}
.art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#10171c22 20%,#10171c00 45%,#10171cee);
}
.rain{
  position:absolute;inset:-20%;opacity:.12;pointer-events:none;
  background:repeating-linear-gradient(108deg,transparent 0 36px,#d7e9e5 37px,transparent 38px 68px);
  animation:rain 1.2s linear infinite;
}
@keyframes rain{to{transform:translate(-22px,66px)}}
.art-top{
  position:absolute;z-index:2;top:32px;left:32px;right:32px;
  display:flex;justify-content:space-between;color:#e3dfcb;
  font:11px/1.6 monospace;letter-spacing:3px;
}
.art-top span:last-child{text-align:right}
.art-bottom{position:absolute;z-index:2;bottom:38px;left:34px;right:30px}
.chapter{font:11px/1.5 sans-serif;letter-spacing:5px;color:var(--gold)}
.art h1{
  margin:12px 0 14px;font-size:clamp(64px,8vw,126px);
  font-weight:900;letter-spacing:-6px;line-height:1;
  text-shadow:4px 3px 0 #bc72512b;
}
.art-quote{font-size:14px;line-height:1.9;max-width:290px;color:#bfbdad}
.coordinates{
  display:flex;gap:16px;margin-top:24px;padding-top:18px;
  border-top:1px solid #ffffff26;
  font:10px monospace;color:#9ca9a3;letter-spacing:2px;
}
.stamp{
  position:absolute;z-index:2;left:30px;top:37%;
  color:#cb755ac9;border:3px solid currentColor;
  padding:8px 12px;font-size:23px;font-weight:bold;
  transform:rotate(-12deg);letter-spacing:7px;
}
.main{min-width:0;background:radial-gradient(ellipse at top right,#45413222,transparent 65%)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:22px 34px;border-bottom:1px solid var(--line);
  font:11px/1.6 sans-serif;letter-spacing:2px;color:var(--muted);
}
.tools{display:flex;gap:10px}
.ghost{
  border:1px solid #ffffff25;background:transparent;color:var(--paper);
  padding:7px 10px;cursor:pointer;font-size:12px;letter-spacing:1px;
}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
.status{
  display:flex;flex-wrap:wrap;gap:10px 18px;padding:16px 34px;
  border-bottom:1px solid var(--line);
  font:12px/1.7 sans-serif;color:var(--muted);
}
.status strong{color:var(--paper);font-weight:500}
.status .ember{color:var(--gold)}
.content{max-width:790px;margin:0 auto;padding:38px 42px 64px}
.eyebrow{font:10px/1.8 sans-serif;letter-spacing:3px;color:var(--gold)}
h2{font-size:clamp(27px,3vw,38px);font-weight:500;line-height:1.35;margin:12px 0 30px}
.prose p{font-size:16px;line-height:2;margin:0 0 21px;white-space:pre-line}
.prose .narrator{color:#d5cfbd}
.line{
  border-left:2px solid #ffffff22;padding:2px 0 2px 18px;
  margin:25px 0;
}
.line .speaker{
  display:block;font:11px/1.5 sans-serif;
  letter-spacing:2px;margin-bottom:8px;color:var(--gold);
}
.line p{margin:0;font-size:15px}
.line.logic{border-color:var(--blue)}
.line.logic .speaker{color:var(--blue)}
.line.empathy{border-color:var(--red)}
.line.empathy .speaker{color:var(--red)}
.line.ruin{border-color:var(--green)}
.line.ruin .speaker{color:var(--green)}
.line.body{border-color:var(--gold)}
.line.human{border-color:#91978d}
.line.human .speaker{color:#bfc3b6}
.check{
  background:#0b111550;border:1px solid #ffffff1c;
  padding:15px 17px;margin:25px 0;
  font:12px/1.8 sans-serif;
}
.check b{color:var(--gold);letter-spacing:2px}
.check.fail b{color:var(--red)}
.check .dice{font:24px/1.5 monospace;letter-spacing:5px;margin:6px 0;color:var(--paper)}
.check small{display:block;color:var(--muted)}
.choices{border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
.choice{
  width:100%;display:grid;grid-template-columns:27px 1fr;gap:11px;
  border:1px solid #ffffff18;background:#ffffff02;
  color:var(--paper);text-align:left;padding:16px 17px;
  margin:0 0 10px;cursor:pointer;transition:background .16s,border-color .16s;
}
.choice:hover:not(:disabled){background:#d8b5700d;border-color:#d8b57077}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice .number{font:12px/1.8 monospace;color:var(--gold)}
.choice .label{font-size:15px;line-height:1.65}
.choice .hint{display:block;margin-top:5px;font:11px/1.7 sans-serif;color:var(--muted)}
.choice.danger{border-color:#d4796335}
.choice.special{border-color:#d8b57075;background:#d8b57007}
.footer-note{font:10px/1.8 sans-serif;color:#777f7b;margin-top:22px;letter-spacing:1px}
.evidence-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.tag{border:1px solid #d8b57035;color:#b8ab8c;padding:5px 8px;font:10px sans-serif}
.end-label{
  display:inline-block;border:1px solid var(--gold);padding:7px 12px;
  color:var(--gold);font:11px sans-serif;letter-spacing:3px;margin-bottom:12px;
}
.summary{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font:12px/1.9 sans-serif}
dialog{
  width:min(600px,calc(100% - 30px));max-height:85vh;
  overflow:auto;background:#20272b;color:var(--paper);
  border:1px solid #a6956a66;padding:28px;
}
dialog::backdrop{background:#080d11cc;backdrop-filter:blur(4px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px}
.dialog-head h3{margin:0;font-weight:500;font-size:24px}
.journal-item{padding:20px 0;border-bottom:1px solid var(--line)}
.journal-item h4{margin:0 0 9px;color:var(--gold);font-size:15px}
.journal-item p{font-size:14px;line-height:1.9;color:#bdbdae;margin:0}
.journal-empty{padding:30px 0;color:var(--muted);font-size:14px;line-height:1.9}
.toast{
  position:fixed;z-index:10;bottom:24px;left:50%;transform:translateX(-50%);
  padding:11px 20px;background:#d5c5a2;color:#20272b;
  font:12px/1.6 sans-serif;max-width:90vw;
  box-shadow:0 8px 40px #0005;pointer-events:none;
}
@media(min-width:1500px){.content{padding-top:55px}.prose p{font-size:18px}}
@media(max-width:850px){
  .shell{grid-template-columns:36% 64%}
  .content{padding:30px 26px 50px}
  .topbar,.status{padding-left:24px;padding-right:24px}
  .art-bottom{left:22px}.art h1{font-size:76px}
  .art-top{left:22px;right:18px}.art-top span:last-child{display:none}
  .stamp{left:18px;font-size:18px}
}
@media(max-width:620px){
  .shell{display:block}
  .art{position:relative;height:310px;border-right:0;border-bottom:1px solid var(--line)}
  .art svg{position:absolute;inset:0}
  .art-top{top:18px;left:22px}
  .art-bottom{bottom:23px;left:23px}
  .art h1{font-size:70px;margin:10px 0;letter-spacing:-3px}
  .art-quote{font-size:12px;margin:0;max-width:250px}
  .chapter{font-size:9px;letter-spacing:3px}
  .coordinates{display:none}
  .stamp{left:auto;right:24px;top:105px;font-size:19px}
  .topbar{padding:15px 20px}.status{padding:12px 20px;gap:8px 14px;font-size:11px}
  .content{padding:27px 23px 45px}
  .prose p{font-size:16px;line-height:1.95}
  .choice{padding:14px 12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<script>
"use strict";

const $ = id => document.getElementById(id);
const KEY = "weiwang-station-chapter-1-v1";
const skillNames = {logic:"逻辑",empathy:"共感",ruin:"废墟感",body:"血肉"};

const profiles = {
  clerk:{
    name:"过期的文书",
    stats:{logic:5,empathy:2,ruin:3,body:2},
    description:"你相信标点。至少标点不会在月底拖欠工资。"
  },
  listener:{
    name:"不合格的倾听者",
    stats:{logic:3,empathy:5,ruin:2,body:2},
    description:"别人的悲伤总能找到你。你从没给过它们地址。"
  },
  porter:{
    name:"被辞退的搬运工",
    stats:{logic:2,empathy:3,ruin:2,body:5},
    description:"你曾经替城市搬运未来。后来，他们买了一台叉车。"
  }
};

const evidenceData = {
  date:{
    title:"提前十九分钟的死亡",
    text:"注销清册写着：南汊二十三名居民于今日 06:00 死亡。站内时钟停在你抵达时的 05:41。清册不是在记录过去，而是在安排未来。"
  },
  seal:{
    title:"财政处的压痕",
    text:"死亡清册下面压着港区资产交割单。两份文件使用同一枚财政处钢印。空置交割必须先把居民从名册上抹掉。老值班员的附签栏仍然空着。"
  },
  people:{
    title:"二十三个名字",
    text:"阿祁提供的名单包含二十三名仍活着的居民。沈小满是第十七个；她在自己的名字后面画了一条有六条腿的狗。名单不是统计，它有人握过的温度。"
  },
  clause:{
    title:"临检条例第九条",
    text:"因文书争议产生的涉案证物，可由临检员签署移送单，搭乘末航转交北岸复核。证人移送则须发现公文伪造证据，并由一名在岗职员联署。"
  }
};

function fresh(){
  return {
    version:1,scene:"start",profile:null,nerve:2,trust:0,
    evidence:[],flags:{},checks:{},ending:null
  };
}
let state = fresh();
let restored = false;
try{
  const saved = JSON.parse(localStorage.getItem(KEY));
  const allowed = ["start","intro","hub","ledger","woman","plate","clerk","final","force","ending"];
  if(saved && saved.version===1 && allowed.includes(saved.scene) &&
     (saved.scene==="start" || profiles[saved.profile]) &&
     Array.isArray(saved.evidence) && saved.flags && saved.checks &&
     Number.isFinite(saved.nerve) && Number.isFinite(saved.trust)){
    state = saved;
    restored = true;
  }
}catch(e){}

const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let toastTimer;
function toast(text){
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{$("toast").hidden=true},2600);
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    $("saveStatus").textContent = "案卷已保存 / 末航尚未离岸";
  }catch(e){
    $("saveStatus").textContent = "无法本地存档 / 本次仍可游玩";
  }
}
function addEvidence(id){
  if(!state.evidence.includes(id)){
    state.evidence.push(id);
    toast("手记新增："+evidenceData[id].title);
  }
}
const has = id => state.evidence.includes(id);
const stats = () => profiles[state.profile]?.stats || {};
const N = text => ({kind:"narrator",text});
const V = (kind,speaker,text) => ({kind,speaker,text});
const C = (label,run,hint="",disabled=false,style="") => ({label,run,hint,disabled,style});
const go = scene => {state.scene=scene};
const back = () => C("退回候船厅。",()=>go("hub"),"已获得的线索与检定结果会保留");
const scene = (eyebrow,title,lines,choices) => ({eyebrow,title,lines,choices});

function checkInfo(skill,target,bonus=0){
  return `2D6 + ${skillNames[skill]} ${stats()[skill]}${bonus?` + 情境 ${bonus}`:""} ≥ ${target}；双 1 必败，双 6 必成`;
}
function roll(id,skill,target,bonus=0){
  const old = state.checks[id];
  if(old){
    if(old.ok || old.tries>=2 || state.nerve<1) return;
    state.nerve--;
  }
  const dice = [1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
  const total = dice[0]+dice[1]+stats()[skill]+bonus;
  const snake = dice[0]===1 && dice[1]===1;
  const twelve = dice[0]===6 && dice[1]===6;
  const ok = twelve || (!snake && total>=target);
  state.checks[id] = {dice,total,target,skill,bonus,ok,tries:(old?.tries||0)+1};

  if(id==="ledger"){
    addEvidence("date");
    if(ok) addEvidence("seal");
  }
  if(id==="names" && ok){
    addEvidence("people");
    if(!state.flags.nameTrust){
      state.trust++;
      state.flags.nameTrust=true;
    }
  }
  if(id==="plate" && ok) addEvidence("clause");
  if(id==="force"){
    state.flags.injured=!ok;
    state.flags.badgeLost=true;
  }
}
function retry(id,skill,target,bonus=0){
  const r=state.checks[id];
  if(!r || r.ok || r.tries>=2) return [];
  return [C(
    "不。再试一次。",
    ()=>roll(id,skill,target,bonus),
    `消耗 1 点「余火」，重新掷骰 · ${checkInfo(skill,target,bonus)}`,
    state.nerve<1
  )];
}
function R(id){return {kind:"check",id}}
function legalReady(){
  return has("date") && has("people") && has("clause") && state.trust>=1;
}
function legalBonus(){return Math.min(state.evidence.length,3)+Math.min(state.trust,2)}
function finish(id){
  state.ending=id;
  state.scene="ending";
}

  force(){
    const r=state.checks.force;
    const bonus=Math.min(Math.max(state.trust,0),2);
    if(!r){
      return scene("行动 / 不被允许的出口","桌腿的意见，不重要。",[
        N("你走到桌边。郁白抬头，以为你终于要签字。"),
        N("铁门钥匙的链条穿过桌腿上的铜环。只要铜环脱落，你就能打开栅门。\n船上的水手已经看见你了。他没有离开跳板。"),
        V("body","血肉","有些论证不需要完整的句子。"),
        N("成功，你保住手腕。失败，你用受伤的手把事情做完。无论骰子怎样，人都会上船。\n但从你动手起，你就不再是这里的核验员。")
      ],[
        C("把徽章垫进铜环，用整个身体去扳。",()=>{
          roll("force","body",11,bonus);
        },checkInfo("body",11,bonus)+"；不可撤回",false,"danger"),
        C("松开手。重新考虑。",()=>go("final"),"尚未产生后果")
      ]);
    }
    return scene("行动 / 木头裂开的声音","它终于不是一张办公桌了。",[
      R("force"),
      N(r.ok
        ? "铜环连着一块木头被你扯了下来。你踉跄两步，握住了钥匙。\n徽章弯成一个再也不能别回衣领的形状。"
        : "第一下没能扯开铜环。疼痛沿手腕炸开。\n第二下，你把整张桌子掀翻了。木头断裂，钥匙掉在地上。小满跑过来，替你捡起来。"),
      V("human","郁白","“码头摄像头坏了。”"),
      N("你看向角落。摄像头的红灯仍然亮着。\n郁白拿起一块擦章布，盖了上去。"),
      V("empathy","共感","不是所有人都能先做第一个。但有时候，他们能做第二个。")
    ],[
      C("打开铁门。让二十三个人通过。",()=>finish("gate"),"完成这一章",false,"special")
    ]);
  },

  ending(){
    const endings={
      one:{
        number:"I",title:"一个人的救生艇",stamp:"结班完成",
        quote:"你救下了一个人。<br>这句话是真的。它也不完整。",
        lines:[
          N("阿祁蹲下来，把那只断了把的搪瓷杯塞进小满的书包。\n她没有拥抱你，也没有责骂你。她只是反复确认北岸接待所的名字。"),
          V("human","沈小满","“妈妈坐下一班吗？”"),
          N("你知道没有下一班。\n你说：“先上去。”"),
          N("船离开以后，你在回执上签了字。二十二个人仍站在你身后，而纸上，他们已经不在那里。"),
          V("logic","逻辑","救下一个，大于没有救下。"),
          V("empathy","共感","不要用算式替她回答。"),
          N("本章结束时，潮水尚未漫过门槛。\n你还有时间看着他们。这不是宽恕。")
        ],
        result:"1 人离岸 · 22 人仍被困 · 注销回执已签署 · 职位保留"
      },
      cargo:{
        number:"II",title:"以物之名",stamp:"准予移送",
        quote:"他们被批准离开。<br>理由不是他们还活着。",
        lines:[
          N("郁白在移送单上盖了章。\n二十三人，按一批计。不得拆分。不得遗失。"),
          N("水手看了看纸，又看了看阿祁。\n“货放下面。”他说。\n你挡在舱口：“怕水。这批放上面。”"),
          V("logic","逻辑","漂亮。一次正确使用了错误分类的行政行为。"),
          V("empathy","共感","闭嘴。至少等他们听不见的时候再夸自己。"),
          N("船驶离南汊。阿祁拿着移送单，一遍一遍读自己的名字。\n“到了那边，”她问，“我们什么时候能不算东西？”"),
          N("你没有说“很快”。\n你在手记的下一页写下：北岸复核。二十三名证人。明早第一件事。")
        ],
        result:"23 人离岸 · 身份待复核 · 你是移送责任人 · 注销程序受到质疑"
      },
      gate:{
        number:"III",title:"闸外的人",stamp:"越权离岗",
        quote:"门开了。<br>接下来，轮到你的案卷被打开。",
        lines:[
          N("第一位老人通过铁门时，朝你点了一下头。他不知道你的名字。你也没有告诉他。"),
          N("阿祁让小满数人数。数到二十三，她又从头数了一遍。\n水手解开缆绳。他决定没看见那份不存在的名单。"),
          N(state.flags.injured
            ? "你的手腕肿得无法扣上外套。阿祁把干毛巾撕成长条，替你固定住。\n你第一次真正用上了自己递出去的东西。"
            : "你的手还在发抖。不是因为受伤。身体只是比道德晚一点明白刚才发生了什么。"),
          V("body","血肉","还站着。够了。剩下的以后再疼。"),
          N("弯掉的徽章留在临检所地板上。明天，它会被拍照、编号，装进透明袋。\n那将是你在这份工作里得到的最正式的一次承认。"),
          N("你跟着二十三个人上了船。\n没有人为你预留位置。阿祁往旁边挪了一点。")
        ],
        result:`23 人离岸 · 徽章遗失 · 将面临越权调查 · ${state.flags.injured?"手腕受伤":"没有重伤"}`
      },
      witness:{
        number:"IV",title:"仍然活着",stamp:"证人移送",
        quote:"不是货物，不是统计误差。<br>是证人。",
        lines:[
          N("你把“证物”的最后一个字划掉。\n郁白盯着新的那个字，看了很久。"),
          V("human","郁白","“证人要出庭的。”"),
          V("human","阿祁","“那就给我们一个能到场的地址。”"),
          N("他签了名。笔尖在退休申请上洇出一个小小的墨点。\n没有音乐响起。城市不会为一个螺丝松动而演奏。"),
          N("二十三人以证人身份登船。死亡清册、交割单，以及那枚钢印的拓痕，被封进同一个文件袋。"),
          V("logic","逻辑","这只能阻止今夜的注销。财政处仍然可以争辩，听证会仍然可以拖延。"),
          V("empathy","共感","我知道。\n但他们可以亲自坐在那里，听对方撒谎。"),
          N("小满把那条六条腿的狗画在了你的手记封面上。\n“现在不用跑那么快了。”她说。"),
          N("你没有告诉她，狗也可以只是想跑。\n这个知识，应该留给一个更好的早晨。")
        ],
        result:"23 人以证人身份离岸 · 伪造证据封存 · 郁白联署 · 后续调查开启"
      }
    };
    const e=endings[state.ending] || endings.cargo;
    return {
      ...scene("第一章 / 完",e.title,e.lines,[
        C("翻开手记，查看留下的证据。",openJournal,"不会重置这一结局"),
        C("另一种过去，另一个雨夜。",reset,"重新开始；将清除本轮进度")
      ]),
      ending:e
    };
  }
};

let actions=[];

function render(){
  const current=(scenes[state.scene] || scenes.start)();
  const profile=profiles[state.profile];
  $("status").innerHTML=profile
    ? Object.entries(profile.stats).map(([k,v])=>`<span>${skillNames[k]} <strong>${v}</strong></span>`).join("")
      + `<span class="ember">余火 ${"●".repeat(state.nerve)}${"○".repeat(2-state.nerve)}</span>`
      + `<span>信任 <strong>${state.trust}</strong></span>`
    : `<span>雨夜档案 001</span><span>2D6 检定</span><span>失败也会继续故事</span>`;

  let html=`<div class="eyebrow">${escapeHTML(current.eyebrow)}</div>`;
  if(current.ending){
    html+=`<div class="end-label">结局 ${current.ending.number} / IV</div>`;
  }
  html+=`<h2>${escapeHTML(current.title)}</h2><div class="prose">`;

  for(const line of current.lines){
    if(line.kind==="check"){
      const r=state.checks[line.id];
      if(!r)continue;
      html+=`<div class="check ${r.ok?"":"fail"}">
        <b>${escapeHTML(skillNames[r.skill])}检定 · ${r.ok?"成功":"失败"}</b>
        <div class="dice">[${r.dice[0]}] [${r.dice[1]}]</div>
        <div>骰点 ${r.dice[0]+r.dice[1]} + 能力 ${stats()[r.skill]}${r.bonus?` + 情境 ${r.bonus}`:""} = ${r.total} / 目标 ${r.target}</div>
        <small>双 1 必败，双 6 必成。${r.tries>1?"已消耗余火重试。":"结果已经保存。"}</small>
      </div>`;
    }else if(line.kind==="narrator"){
      html+=`<p class="narrator">${escapeHTML(line.text)}</p>`;
    }else{
      html+=`<div class="line ${line.kind}">
        <span class="speaker">${escapeHTML(line.speaker)}</span>
        <p>${escapeHTML(line.text)}</p>
      </div>`;
    }
  }
  html+="</div>";
  if(current.ending){
    html+=`<div class="summary">${escapeHTML(current.ending.result)}<br>本轮发现 ${state.evidence.length} / 4 条线索；剩余余火 ${state.nerve}。</div>`;
  }
  $("story").innerHTML=html;

  actions=current.choices;
  $("choices").innerHTML=actions.map((a,i)=>`
    <button class="choice ${a.style||""}" data-choice="${i}" ${a.disabled?"disabled":""}>
      <span class="number">${String(i+1).padStart(2,"0")}</span>
      <span><span class="label">${escapeHTML(a.label)}</span>
      ${a.hint?`<span class="hint">${escapeHTML(a.hint)}</span>`:""}</span>
    </button>
  `).join("");

  $("clueCount").textContent=state.evidence.length;
  $("evidenceStrip").innerHTML=state.evidence.filter(id=>evidenceData[id])
    .map(id=>`<span class="tag">＋ ${escapeHTML(evidenceData[id].title)}</span>`).join("");

  $("artStamp").textContent=current.ending?.stamp || "尚未生效";
  $("artQuote").innerHTML=current.ending?.quote || "这座城没有杀死任何人。<br>它只是提前完成了统计。";
}

function act(index){
  const a=actions[index];
  if(!a || a.disabled)return;
  const oldScene=state.scene;
  a.run();
  save();
  render();
  if(oldScene!==state.scene){
    if(matchMedia("(max-width:620px)").matches){
      document.querySelector(".main").scrollIntoView({behavior:"auto",block:"start"});
    }else{
      window.scrollTo({top:0,behavior:"auto"});
    }
  }
}

function openJournal(){
  const clues=state.evidence.filter(id=>evidenceData[id]).map(id=>{
    const e=evidenceData[id];
    return `<section class="journal-item"><h4>${escapeHTML(e.title)}</h4><p>${escapeHTML(e.text)}</p></section>`;
  }).join("");
  const notes=[];
  if(state.flags.kind)notes.push("你先递出了毛巾，再询问姓名。");
  if(state.flags.apologized)notes.push("你为自己的盘问道过歉。道歉没有倒转时间，但改变了接下来的谈话。");
  if(state.flags.selfWritten)notes.push("安慰失败之后，你让大家亲手写下名字。");
  if(state.flags.clerkAlly)notes.push("郁白答应联署：只签他亲眼见过的事实。");
  if(state.flags.scraped)notes.push("徽章被你用来刮开条例上的黑漆。");
  if(state.flags.badgeLost)notes.push("徽章留在了临检所。你带走了钥匙。");
  $("journalBody").innerHTML=
    (clues || `<p class="journal-empty">目前只有一页空白。<br>空白在这里不是无辜，只是尚未填写。</p>`)
    + (notes.length?`<section class="journal-item"><h4>你做过的事</h4><p>${notes.map(escapeHTML).join("<br><br>")}</p></section>`:"")
    + `<section class="journal-item"><h4>检定规则</h4><p>掷两枚六面骰，加上对应能力与情境奖励。达到目标即成功；双 1 必败，双 6 必成。<br><br>失败的普通检定可消耗 1 点余火重试一次。强行开门不能重试，但失败不会阻止居民登船。调查不会因现实时间流逝而失效。</p></section>`;
  if(!$("journal").open)$("journal").showModal();
}

function reset(){
  if(!confirm("重新开始这个雨夜？本轮存档会被覆盖。"))return;
  if($("journal").open)$("journal").close();
  state=fresh();
  save();
  render();
  window.scrollTo({top:0,behavior:"auto"});
}

$("choices").addEventListener("click",event=>{
  const button=event.target.closest("[data-choice]");
  if(button)act(Number(button.dataset.choice));
});
$("journalBtn").addEventListener("click",openJournal);
$("closeJournal").addEventListener("click",()=>$("journal").close());
$("resetBtn").addEventListener("click",reset);
document.addEventListener("keydown",event=>{
  if(event.repeat || event.ctrlKey || event.metaKey || event.altKey || $("journal").open)return;
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;
  if(/^[1-9]$/.test(event.key)){
    event.preventDefault();
    act(Number(event.key)-1);
  }
});

render();
if(restored){
  $("saveStatus").textContent="已恢复案卷 / 雨还没有停";
  toast("找回了你上次留下的那一页。");
}
</script>


</body></html>
